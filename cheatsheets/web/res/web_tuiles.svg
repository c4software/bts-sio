<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" width="900" height="330" viewBox="0 0 900 330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <rect width="900" height="330" fill="#ffffff"/>
  <g text-anchor="middle" fill="#0f172a" font-weight="600" font-size="15">
    <text x="225" y="28">Fenêtres flottantes (Windows, macOS)</text>
    <text x="675" y="28">Fenêtres en tuiles (Hyprland, Omarchy)</text>
  </g>
  <!-- écran gauche -->
  <rect x="20" y="45" width="410" height="240" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <g stroke-width="2">
    <rect x="45" y="70" width="220" height="140" rx="6" fill="#ffffff" stroke="#475569"/>
    <rect x="150" y="115" width="230" height="130" rx="6" fill="#ffffff" stroke="#475569"/>
    <rect x="230" y="160" width="170" height="105" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  </g>
  <g fill="#0f172a" font-size="12">
    <text x="57" y="88">Navigateur</text>
    <text x="162" y="133">Éditeur de code</text>
    <text x="242" y="178">Terminal</text>
  </g>
  <!-- écran droit -->
  <rect x="470" y="45" width="410" height="240" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <g stroke-width="2">
    <rect x="482" y="57" width="190" height="216" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="680" y="57" width="188" height="104" rx="6" fill="#ffffff" stroke="#475569"/>
    <rect x="680" y="169" width="188" height="104" rx="6" fill="#ffffff" stroke="#475569"/>
  </g>
  <g fill="#0f172a" font-size="12">
    <text x="494" y="75">Éditeur de code</text>
    <text x="692" y="75">Navigateur</text>
    <text x="692" y="187">Terminal</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#475569">
    <text x="225" y="310">Les fenêtres se chevauchent : on les déplace et on les cherche à la souris</text>
    <text x="675" y="310">Les fenêtres se rangent seules côte à côte : tout se pilote au clavier</text>
  </g>
</svg>
