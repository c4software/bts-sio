<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" width="900" height="276" viewBox="0 0 900 276"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrowg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arrowr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrowb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrowv" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrowa" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
<rect width="900" height="276" fill="#ffffff"/>
<text x="20" y="34" font-weight="600" font-size="16" fill="#0f172a">Une variable String? : trois façons de la lire</text>
<rect x="20" y="56" width="200" height="132" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="120" y="84" font-size="13" font-weight="600" text-anchor="middle" fill="#7c3aed" font-family="ui-monospace, monospace">val nom: String?</text>
<rect x="40" y="100" width="160" height="30" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
<text x="120" y="120" font-size="12" text-anchor="middle" fill="#0f172a" font-family="ui-monospace, monospace">"ESP32"</text>
<rect x="40" y="140" width="160" height="30" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
<text x="120" y="160" font-size="12" text-anchor="middle" fill="#0f172a" font-family="ui-monospace, monospace">null</text>
<rect x="270" y="56" width="190" height="132" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="365" y="82" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="ui-monospace, monospace">nom?.length</text>
<text x="365" y="100" font-size="11" text-anchor="middle" fill="#475569">appel sécurisé</text>
<text x="284" y="120" font-size="11" fill="#475569">"ESP32" →</text>
<text x="446" y="120" font-size="12" font-weight="700" text-anchor="end" fill="#16a34a" font-family="ui-monospace, monospace">5</text>
<text x="284" y="160" font-size="11" fill="#475569">null →</text>
<text x="446" y="160" font-size="12" font-weight="700" text-anchor="end" fill="#16a34a" font-family="ui-monospace, monospace">null</text>
<rect x="475" y="56" width="190" height="132" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="570" y="82" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="ui-monospace, monospace">nom?.length ?: 0</text>
<text x="570" y="100" font-size="11" text-anchor="middle" fill="#475569">valeur par défaut</text>
<text x="489" y="120" font-size="11" fill="#475569">"ESP32" →</text>
<text x="651" y="120" font-size="12" font-weight="700" text-anchor="end" fill="#16a34a" font-family="ui-monospace, monospace">5</text>
<text x="489" y="160" font-size="11" fill="#475569">null →</text>
<text x="651" y="160" font-size="12" font-weight="700" text-anchor="end" fill="#16a34a" font-family="ui-monospace, monospace">0</text>
<rect x="680" y="56" width="190" height="132" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="775" y="82" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a" font-family="ui-monospace, monospace">nom!!.length</text>
<text x="775" y="100" font-size="11" text-anchor="middle" fill="#475569">« je suis sûr »</text>
<text x="694" y="120" font-size="11" fill="#475569">"ESP32" →</text>
<text x="856" y="120" font-size="12" font-weight="700" text-anchor="end" fill="#16a34a" font-family="ui-monospace, monospace">5</text>
<text x="694" y="160" font-size="11" fill="#475569">null →</text>
<text x="856" y="160" font-size="10" font-weight="700" text-anchor="end" fill="#dc2626" font-family="ui-monospace, monospace">NullPointerException</text>
<line x1="220" y1="122" x2="266" y2="122" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="208" width="860" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="36" y="231" font-size="13" font-weight="600" fill="#0f172a">Le compilateur refuse nom.length tout court : il vous oblige à choisir une des trois lignes.</text>
<text x="36" y="251" font-size="13" fill="#475569">En C, rien n'empêche de déréférencer un pointeur NULL. En Python, l'erreur arrive à l'exécution. En Kotlin, à la compilation.</text>
</svg>
