<text x="369" y="205" font-size="12" text-anchor="middle" fill="#475569">câble USB</text>
<text x="369" y="231" font-size="12" font-weight="600" text-anchor="middle" fill="#475569" font-family="ui-monospace, monospace">adb</text>
<line x1="620" y1="213" x2="718" y2="213" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowg)"/>
<line x1="718" y1="223" x2="622" y2="223" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowg)"/>
<text x="669" y="205" font-size="12" text-anchor="middle" fill="#16a34a">Bluetooth</text>
<text x="669" y="241" font-size="12" text-anchor="middle" fill="#16a34a">Low Energy</text>
<rect x="20" y="276" width="860" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="36" y="299" font-size="13" font-weight="600" fill="#0f172a">Le bouton ▶ d'Android Studio compile l'application puis l'installe avec adb.</text>
<text x="36" y="319" font-size="13" fill="#475569">La commande adb devices liste ce qui est branché : si votre téléphone n'y est pas, le bouton ▶ ne le verra pas non plus.</text>
