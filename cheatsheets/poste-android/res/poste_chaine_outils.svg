<text x="52" y="119" font-size="12" font-weight="600" fill="#0f172a">Android Studio</text>
<text x="288" y="119" font-size="11" text-anchor="end" fill="#475569">l'éditeur, le bouton ▶</text>
<rect x="40" y="136" width="260" height="32" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1"/>
<text x="52" y="157" font-size="12" font-weight="600" fill="#0f172a">SDK Android</text>
<text x="288" y="157" font-size="11" text-anchor="end" fill="#475569">les outils, dont adb</text>
