<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2233"/><stop offset="1" stop-color="#0d1119"/></linearGradient>
    <radialGradient id="spot" cx="0.72" cy="0.45" r="0.55"><stop offset="0" stop-color="#ffd27a" stop-opacity="0.55"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/></pattern>
  </defs>
  <rect width="960" height="360" fill="url(#bg)"/>
  <rect width="960" height="360" fill="url(#grid)"/>
  <rect width="960" height="360" fill="url(#spot)"/>

  <!-- affiche WANTED -->
  <g transform="translate(60 40) rotate(-3)">
    <rect width="250" height="280" fill="#f3e4b8" stroke="#8a6d3b" stroke-width="3"/>
    <rect x="10" y="10" width="230" height="260" fill="none" stroke="#8a6d3b" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="125" y="52" text-anchor="middle" font-size="34" font-weight="bold" fill="#5a3d1a" letter-spacing="4">WANTED</text>
    <g transform="translate(125 130)">
      <circle r="42" fill="#d9c69a"/>
      <text y="16" text-anchor="middle" font-size="52" font-family="system-ui" fill="#5a3d1a">?</text>
    </g>
    <text x="125" y="205" text-anchor="middle" font-size="14" fill="#5a3d1a">Recherché pour crime à</text>
    <text x="125" y="228" text-anchor="middle" font-size="20" font-weight="bold" fill="#5a3d1a">SQL VILLE</text>
    <text x="125" y="255" text-anchor="middle" font-size="11" fill="#8a6d3b" font-family="monospace">SELECT nom FROM personne …</text>
  </g>

  <!-- loupe -->
  <g transform="translate(800 160)">
    <circle r="78" fill="#0d1119" fill-opacity="0.85" stroke="#e9eef5" stroke-width="10"/>
    <circle r="78" fill="none" stroke="#3b5bdb" stroke-width="3"/>
    <line x1="58" y1="58" x2="150" y2="150" stroke="#e9eef5" stroke-width="22" stroke-linecap="round"/>
    <line x1="62" y1="62" x2="150" y2="150" stroke="#8a6d3b" stroke-width="14" stroke-linecap="round"/>
    <!-- table vue à la loupe -->
    <g font-family="monospace" font-size="12" fill="#e9eef5">
      <text x="-55" y="-30">id   nom</text>
      <line x1="-58" y1="-22" x2="58" y2="-22" stroke="#e9eef5" stroke-opacity="0.6"/>
      <text x="-55" y="-6">18   ?????</text>
      <text x="-55" y="14">42   ?????</text>
      <text x="-55" y="34" fill="#ffd27a" font-weight="bold">99   ★ ????</text>
    </g>
  </g>

  <!-- titre -->
  <g transform="translate(345 120)">
    <text font-size="16" fill="#ffd27a" letter-spacing="6" font-family="system-ui">BRIGADE DES REQUÊTES</text>
    <text y="52" font-size="44" font-weight="bold" fill="#ffffff">Enquête SQL</text>
    <text y="88" font-size="17" fill="#c7d0dc" font-family="system-ui">10 000 habitants. Un seul coupable.</text>
    <text y="112" font-size="17" fill="#c7d0dc" font-family="system-ui">Votre seule arme : le SELECT.</text>
  </g>

  <!-- empreintes / traces -->
  <g fill="#ffd27a" fill-opacity="0.35">
    <ellipse cx="420" cy="290" rx="9" ry="14" transform="rotate(-20 420 290)"/>
    <ellipse cx="450" cy="310" rx="9" ry="14" transform="rotate(-20 450 310)"/>
    <ellipse cx="480" cy="285" rx="9" ry="14" transform="rotate(-20 480 285)"/>
    <ellipse cx="510" cy="305" rx="9" ry="14" transform="rotate(-20 510 305)"/>
    <ellipse cx="540" cy="280" rx="9" ry="14" transform="rotate(-20 540 280)"/>
  </g>
  <text x="940" y="348" text-anchor="end" font-size="11" fill="#6b7788" font-family="system-ui">Dossier n° 20180115 · Commissariat de SQL Ville</text>
</svg>
