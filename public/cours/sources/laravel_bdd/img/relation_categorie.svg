<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" width="900" height="330" viewBox="0 0 900 330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <rect width="900" height="330" fill="#ffffff"/>
  <!-- categories -->
  <g stroke="#475569" stroke-width="1.5">
    <rect x="40" y="40" width="260" height="150" rx="8" fill="#ffffff"/>
    <rect x="40" y="40" width="260" height="34" rx="8" fill="#7c3aed"/>
    <rect x="40" y="60" width="260" height="14" fill="#7c3aed" stroke="none"/>
  </g>
  <text x="170" y="63" text-anchor="middle" font-weight="600" fill="#ffffff">categories</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0f172a">
    <text x="55" y="98" font-weight="600">id</text><text x="285" y="98" text-anchor="end" fill="#475569">clé primaire</text>
    <text x="55" y="124">nom</text>
    <text x="55" y="150">created_at</text>
    <text x="55" y="176">updated_at</text>
  </g>
  <g stroke="#e2e8f0"><line x1="40" y1="106" x2="300" y2="106"/><line x1="40" y1="132" x2="300" y2="132"/><line x1="40" y1="158" x2="300" y2="158"/></g>
  <!-- todos -->
  <g stroke="#475569" stroke-width="1.5">
    <rect x="600" y="40" width="260" height="150" rx="8" fill="#ffffff"/>
    <rect x="600" y="40" width="260" height="34" rx="8" fill="#16a34a"/>
    <rect x="600" y="60" width="260" height="14" fill="#16a34a" stroke="none"/>
  </g>
  <text x="730" y="63" text-anchor="middle" font-weight="600" fill="#ffffff">todos</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0f172a">
    <text x="615" y="98" font-weight="600">id</text><text x="845" y="98" text-anchor="end" fill="#475569">clé primaire</text>
    <text x="615" y="124">texte</text>
    <text x="615" y="150">termine</text>
    <text x="615" y="176" font-weight="600" fill="#dc2626">categorie_id</text><text x="845" y="176" text-anchor="end" fill="#dc2626">clé étrangère</text>
  </g>
  <g stroke="#e2e8f0"><line x1="600" y1="106" x2="860" y2="106"/><line x1="600" y1="132" x2="860" y2="132"/><line x1="600" y1="158" x2="860" y2="158"/></g>
  <!-- relation line : crow's foot -->
  <line x1="300" y1="94" x2="600" y2="172" stroke="#dc2626" stroke-width="2"/>
  <line x1="300" y1="86" x2="300" y2="102" stroke="#dc2626" stroke-width="2"/>
  <g stroke="#dc2626" stroke-width="2" fill="none">
    <line x1="600" y1="172" x2="582" y2="160"/>
    <line x1="600" y1="172" x2="582" y2="184"/>
    <line x1="600" y1="172" x2="578" y2="172"/>
  </g>
  <text x="330" y="82" fill="#dc2626" font-weight="600">1</text>
  <text x="560" y="150" fill="#dc2626" font-weight="600">n</text>
  <text x="450" y="210" text-anchor="middle" fill="#0f172a">une catégorie possède plusieurs TODO</text>
  <text x="450" y="227" text-anchor="middle" fill="#475569" font-size="12">une TODO appartient à une seule catégorie</text>
  <!-- code -->
  <rect x="40" y="245" width="380" height="65" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="55" y="268" font-weight="600">Modèle Categorie</text>
  <text x="55" y="292" font-family="ui-monospace, monospace" font-size="12">todos() → $this-&gt;hasMany(Todo::class)</text>
  <rect x="480" y="245" width="380" height="65" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="495" y="268" font-weight="600">Modèle Todo</text>
  <text x="495" y="292" font-family="ui-monospace, monospace" font-size="12">categorie() → $this-&gt;belongsTo(Categorie::class)</text>
</svg>
