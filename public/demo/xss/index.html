<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XSS ME</title>

    <style>
        body{
            font-family: system-ui, sans-serif;
        }

        .consigne{
            margin: 0 0 8px;
            line-height: 1.5;
        }

        .consigne code{
            padding: 2px 6px;
            border-radius: 4px;
            background: #f1f1f4;
            font-size: 0.95em;
            white-space: nowrap;
        }

        #input{
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
        }

        div{
            width: 100%;
            display: flex;
            justify-content: center;
            padding-top: 16px;
        }

    </style>
</head>
<body>
    
    <p class="consigne">
        Pour tester la faille, placez-vous à la fin de l'adresse de l'image et ajoutez :
        <code>" onload="alert()"</code><br>
        Une fenêtre d'alerte s'ouvre : le JavaScript saisi dans le champ a été exécuté.
    </p>

    <input onkeyup="triggerLoad()" type="text" id="input" value="https://imagefaker.access.mx.com/300/" placeholder="Entre un lien d'image">

    <div id="content">
    </div>

    <script>
        function triggerLoad(){
            document.getElementById("content").innerHTML = '<img id="img" src="' + document.getElementById("input").value + '">';
        }

        const urlSearchParams = new URLSearchParams(window.location.search);
        const params = Object.fromEntries(urlSearchParams.entries());

        if(params["uri"]){
            document.getElementById("input").value=params["uri"];
        }

        triggerLoad();
    </script>
</body>
</html>
