name: Hello
options:
  bundleIdPrefix: fr.prenom.nom
  deploymentTarget:
    iOS: "17.0"
targets:
  Hello:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Hello
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.prenom.nom.hello
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
