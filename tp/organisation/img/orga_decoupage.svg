    <rect x="710" y="236" width="150" height="70" rx="10" fill="#ffffff" stroke="#475569"/>
    <rect x="500" y="314" width="150" height="28" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="710" y="314" width="150" height="28" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  </g>
  <g text-anchor="middle" fill="#0f172a" font-family="ui-monospace, monospace" font-size="12">
    <text x="575" y="218">head("Shitty…")</text>
    <text x="785" y="218">head("Search")</text>
    <text x="575" y="333">foot()</text>
    <text x="785" y="333">foot()</text>
  </g>
  <g text-anchor="middle" fill="#0f172a">
    <text x="575" y="275">3 listes de liens</text>
    <text x="785" y="267">1 liste</text>
    <text x="785" y="284">+ formulaire</text>
  </g>
  <g stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrowb)">
    <path d="M620,115 L575,160"/>
    <path d="M740,115 L785,160"/>
  </g>
  <g font-size="12" fill="#2563eb" font-family="ui-monospace, monospace">
    <text x="530" y="140">include</text>
    <text x="772" y="140">include</text>
  </g>
  <text x="680" y="375" text-anchor="middle" fill="#16a34a">Une modification du header : un seul fichier à changer</text>
