  <rect x="560" y="45" width="240" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="680" y="68" text-anchor="middle" font-weight="600" fill="#0f172a">fonctions/index.php</text>
  <text x="680" y="88" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#0f172a">function head($titre)</text>
  <text x="680" y="105" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#0f172a">function foot()</text>

  <g font-weight="600" fill="#0f172a" text-anchor="middle">
    <text x="575" y="175">index.php</text>
    <text x="785" y="175">detail.php</text>
  </g>
  <g stroke-width="2">
    <rect x="485" y="185" width="180" height="165" rx="10" fill="#f1f5f9" stroke="#475569"/>
    <rect x="695" y="185" width="180" height="165" rx="10" fill="#f1f5f9" stroke="#475569"/>
    <rect x="500" y="198" width="150" height="30" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="710" y="198" width="150" height="30" rx="10" fill="#dcfce7" stroke="#16a34a"/>
