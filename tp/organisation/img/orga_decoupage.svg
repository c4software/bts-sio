<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" width="900" height="400" viewBox="0 0 900 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <defs>
    <marker id="arrowb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="220" y="30" text-anchor="middle" font-weight="600" font-size="16" fill="#0f172a">Avant : chaque page porte tout</text>
  <text x="680" y="30" text-anchor="middle" font-weight="600" font-size="16" fill="#0f172a">Après : écrit une fois, inclus partout</text>
  <line x1="450" y1="15" x2="450" y2="385" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- AVANT -->
  <g font-weight="600" fill="#0f172a" text-anchor="middle">
    <text x="120" y="70">index.php</text>
    <text x="320" y="70">detail.php</text>
  </g>
  <g stroke-width="2">
    <rect x="30" y="80" width="180" height="270" rx="10" fill="#f1f5f9" stroke="#475569"/>
    <rect x="230" y="80" width="180" height="270" rx="10" fill="#f1f5f9" stroke="#475569"/>
    <rect x="45" y="95" width="150" height="50" rx="10" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="245" y="95" width="150" height="50" rx="10" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="45" y="155" width="150" height="120" rx="10" fill="#ffffff" stroke="#475569"/>
    <rect x="245" y="155" width="150" height="120" rx="10" fill="#ffffff" stroke="#475569"/>
    <rect x="45" y="285" width="150" height="50" rx="10" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="245" y="285" width="150" height="50" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  </g>
  <g text-anchor="middle" fill="#0f172a">
    <text x="120" y="117">&lt;head&gt;, CSS,</text><text x="120" y="134">barre du haut</text>
    <text x="320" y="117">&lt;head&gt;, CSS,</text><text x="320" y="134">barre du haut</text>
    <text x="120" y="210">3 listes de liens</text>
    <text x="320" y="210">1 liste + formulaire</text>
    <text x="120" y="307">footer, scripts,</text><text x="120" y="324">&lt;/html&gt;</text>
    <text x="320" y="307">footer, scripts,</text><text x="320" y="324">&lt;/html&gt;</text>
  </g>
  <text x="220" y="375" text-anchor="middle" fill="#dc2626">En rouge : le même HTML copié dans les deux pages</text>

