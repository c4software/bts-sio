<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" width="900" height="420" viewBox="0 0 900 420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrowa" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
  </defs>
  <rect width="900" height="420" fill="#ffffff"/>
  <!-- parametres -->
  <rect x="330" y="20" width="240" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="450" y="45" text-anchor="middle" font-weight="600" fill="#0f172a">parametre/parametres.php</text>
  <text x="450" y="66" text-anchor="middle" font-size="12" fill="#475569">ce qui peut changer un jour</text>
  <g stroke="#d97706" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrowa)">
    <path d="M330,50 H105 V148"/>
    <line x1="450" y1="80" x2="450" y2="148"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="11" fill="#d97706">
    <text x="115" y="95">$_SITE_TITLE</text>
    <text x="115" y="111">$_ELEMENTS</text>
    <text x="460" y="120">$_DATA_PATH</text>
  </g>
  <!-- pages -->
  <rect x="10" y="150" width="190" height="90" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="105" y="178" text-anchor="middle" font-weight="600" fill="#0f172a">Les pages</text>
  <text x="105" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#475569">index.php</text>
  <text x="105" y="218" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#475569">detail.php</text>
  <!-- dao -->
  <rect x="340" y="150" width="220" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="178" text-anchor="middle" font-weight="600" fill="#0f172a">Le DAO : LienDao</text>
  <text x="450" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#0f172a">static get($fichier)</text>
  <text x="450" y="218" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#0f172a">static put(…)</text>
  <line x1="200" y1="195" x2="338" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="262" y="185" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#475569">LienDao::get()</text>
  <text x="262" y="216" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#475569">LienDao::put()</text>
  <!-- json -->
  <g stroke="#475569" stroke-width="2" fill="#dcfce7">
    <path d="M700,150 a70,14 0 0,1 140,0 v60 a70,14 0 0,1 -140,0 z"/>
    <ellipse cx="770" cy="150" rx="70" ry="14"/>
  </g>
  <text x="770" y="190" text-anchor="middle" font-weight="600" fill="#0f172a">data/*.json</text>
  <line x1="560" y1="180" x2="698" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="629" y="172" text-anchor="middle" font-size="11" fill="#475569">lit, écrit</text>
  <!-- mysql -->
  <g stroke="#475569" stroke-width="2" fill="#f1f5f9" stroke-dasharray="6 4">
    <path d="M700,290 a70,14 0 0,1 140,0 v60 a70,14 0 0,1 -140,0 z"/>
    <ellipse cx="770" cy="290" rx="70" ry="14"/>
  </g>
  <text x="770" y="328" text-anchor="middle" font-weight="600" fill="#0f172a">MySQL</text>
  <text x="770" y="346" text-anchor="middle" font-size="11" fill="#475569">(la partie « En plus »)</text>
  <path d="M560,225 H630 V320 H698" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="640" y="276" font-size="11" fill="#475569">demain, PDO</text>
  <!-- modele -->
  <rect x="340" y="290" width="220" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="450" y="315" text-anchor="middle" font-weight="600" fill="#0f172a">Le modèle : class Lien</text>
  <text x="450" y="335" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#475569">$lien, $name + validation</text>
  <g stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="2 4">
    <line x1="450" y1="240" x2="450" y2="290"/>
    <path d="M340,320 H105 V240"/>
  </g>
  <text x="222" y="312" text-anchor="middle" font-size="11" fill="#475569">new Lien(…)</text>
  <text x="460" y="270" font-size="11" fill="#475569">objets Lien</text>
  <text x="450" y="395" text-anchor="middle" fill="#0f172a">Les pages ne savent pas <tspan font-weight="600">où</tspan> sont rangées les données : seul le DAO le sait, c'est le seul fichier à modifier.</text>
</svg>
