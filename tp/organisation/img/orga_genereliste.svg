<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" width="900" height="320" viewBox="0 0 900 320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="900" height="320" fill="#ffffff"/>
  <!-- tableau -->
  <rect x="20" y="70" width="310" height="140" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="175" y="95" text-anchor="middle" font-weight="600" fill="#0f172a">Les données : $elements</text>
  <g font-family="ui-monospace, monospace" font-size="12" fill="#0f172a">
    <text x="36" y="125">["file" =&gt; "search", "title" =&gt; …]</text>
    <text x="36" y="152">["file" =&gt; "reddit", "title" =&gt; …]</text>
    <text x="36" y="179">["file" =&gt; "twitter", "title" =&gt; …]</text>
  </g>
  <!-- boucle -->
  <rect x="385" y="100" width="190" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="125" text-anchor="middle" font-weight="600" fill="#0f172a">foreach</text>
  <text x="480" y="147" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#0f172a">genereListe(</text>
  <text x="480" y="165" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#0f172a">$title, $file)</text>
  <line x1="330" y1="140" x2="383" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- cartes -->
  <g stroke-width="2">
    <rect x="650" y="30" width="230" height="70" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="650" y="110" width="230" height="70" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="650" y="190" width="230" height="70" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  </g>
  <g text-anchor="middle">
    <text x="765" y="58" font-weight="600" fill="#0f172a">Carte « Rechercher »</text>
    <text x="765" y="80" font-family="ui-monospace, monospace" font-size="12" fill="#475569">data/search.json</text>
    <text x="765" y="138" font-weight="600" fill="#0f172a">Carte « Reddit »</text>
    <text x="765" y="160" font-family="ui-monospace, monospace" font-size="12" fill="#475569">data/reddit.json</text>
    <text x="765" y="218" font-weight="600" fill="#0f172a">Carte « Twitter »</text>
    <text x="765" y="240" font-family="ui-monospace, monospace" font-size="12" fill="#475569">data/twitter.json</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M575,125 L648,65"/>
    <line x1="575" y1="140" x2="648" y2="145"/>
    <path d="M575,155 L648,225"/>
  </g>
  <g font-size="11" fill="#475569" text-anchor="middle">
    <text x="605" y="82">tour 1</text>
    <text x="610" y="136">tour 2</text>
    <text x="598" y="205">tour 3</text>
  </g>
  <text x="450" y="300" text-anchor="middle" fill="#0f172a">Une quatrième catégorie ? Une ligne de plus dans le tableau, <tspan font-weight="600">aucun HTML à recopier</tspan>.</text>
</svg>
