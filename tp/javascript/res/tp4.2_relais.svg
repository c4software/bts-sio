<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" width="900" height="400" viewBox="0 0 900 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="arrowr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <g stroke-width="2">
    <rect x="20" y="90" width="170" height="130" rx="10" fill="#f1f5f9" stroke="#475569"/>
    <rect x="310" y="60" width="290" height="190" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="660" y="30" width="220" height="80" rx="10" fill="#f1f5f9" stroke="#475569"/>
    <rect x="660" y="190" width="220" height="80" rx="10" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="20" y="300" width="860" height="70" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  </g>
  <g text-anchor="middle" fill="#0f172a">
    <text x="105" y="118" font-weight="600">Navigateur</text>
    <text x="105" y="140" font-size="13">page servie par</text>
    <text x="105" y="160" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">localhost:9000</text>
    <text x="105" y="190" font-size="13">veille.js</text>
    <text x="455" y="88" font-weight="600">relais.php (votre serveur)</text>
    <text x="455" y="114" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">array_key_exists($source, $sources)</text>
    <text x="455" y="134" font-size="13">l'identifiant est dans la liste blanche ?</text>
    <text x="455" y="168" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">file_get_contents($sources[$source])</text>
    <text x="455" y="200" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">header('Content-Type: application/xml')</text>
    <text x="455" y="220" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">echo $flux</text>
    <text x="770" y="62" font-weight="600">journalduhacker.net</text>
    <text x="770" y="86" font-size="13">le flux RSS</text>
    <text x="770" y="222" font-weight="600">sinon : 400</text>
    <text x="770" y="246" font-size="13">« Source inconnue »,</text>
    <text x="770" y="264" font-size="13">rien n'est téléchargé</text>
    <text x="450" y="326" font-weight="600" fill="#dc2626">Jamais de relais.php?url=… : un relais ouvert lit tout ce qu'on lui donne</text>
    <text x="450" y="352" font-size="13">?url=/etc/passwd, ?url=config.php (et son mot de passe), une machine du réseau interne, le site de quelqu'un d'autre…</text>
  </g>
  <line x1="190" y1="125" x2="308" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="82" text-anchor="middle" font-size="12" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">?source=</text>
  <text x="250" y="98" text-anchor="middle" font-size="12" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">journalduhacker</text>
  <text x="250" y="114" text-anchor="middle" font-size="11" fill="#475569">même origine</text>
  <line x1="308" y1="185" x2="192" y2="185" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowg)"/>
  <text x="250" y="205" text-anchor="middle" font-size="12" fill="#16a34a">le XML,</text>
  <text x="250" y="221" text-anchor="middle" font-size="12" fill="#16a34a">sans CORS</text>
  <line x1="600" y1="70" x2="658" y2="70" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="98" x2="602" y2="98" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowg)"/>
  <line x1="600" y1="230" x2="658" y2="230" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowr)"/>
</svg>
