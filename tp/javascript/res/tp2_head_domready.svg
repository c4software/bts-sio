<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" width="900" height="380" viewBox="0 0 900 380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrowb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="arrowr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="20" y="34" font-weight="600" font-size="15" fill="#0f172a">Script dans le head, exécuté tout de suite</text>
  <g stroke-width="2">
    <rect x="20" y="50" width="240" height="110" rx="10" fill="#f1f5f9" stroke="#475569"/>
    <rect x="305" y="50" width="275" height="110" rx="10" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="625" y="50" width="255" height="110" rx="10" fill="#f1f5f9" stroke="#475569"/>
  </g>
  <g text-anchor="middle" fill="#0f172a">
    <text x="140" y="80" font-weight="600">1. Lecture du head</text>
    <text x="140" y="102" font-size="12" fill="#475569">le navigateur rencontre</text>
    <text x="140" y="122" font-size="12" font-family="ui-monospace, monospace" fill="#475569">&lt;script src="main.js"&gt;</text>
    <text x="442" y="80" font-weight="600">2. main.js s'exécute</text>
    <text x="442" y="102" font-size="12" font-family="ui-monospace, monospace" fill="#dc2626">getElementById('tableau')</text>
    <text x="442" y="122" font-size="12" fill="#dc2626">renvoie null : la div n'existe pas encore</text>
    <text x="442" y="142" font-size="11" font-family="ui-monospace, monospace" fill="#dc2626">TypeError … of null</text>
    <text x="752" y="80" font-weight="600">3. Lecture du body</text>
    <text x="752" y="102" font-size="12" fill="#475569">la div #tableau est créée…</text>
    <text x="752" y="122" font-size="12" fill="#475569">mais le script est déjà passé :</text>
    <text x="752" y="142" font-size="12" fill="#475569">le tableau reste vide</text>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <line x1="260" y1="105" x2="303" y2="105"/>
    <line x1="580" y1="105" x2="623" y2="105"/>
  </g>

  <text x="20" y="214" font-weight="600" font-size="15" fill="#0f172a">Avec DOMContentLoaded</text>
  <g stroke-width="2">
    <rect x="20" y="230" width="240" height="110" rx="10" fill="#fef3c7" stroke="#d97706"/>
    <rect x="305" y="230" width="275" height="110" rx="10" fill="#f1f5f9" stroke="#475569"/>
    <rect x="625" y="230" width="255" height="110" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  </g>
  <g text-anchor="middle" fill="#0f172a">
    <text x="140" y="260" font-weight="600">1. main.js s'exécute</text>
    <text x="140" y="282" font-size="12" fill="#475569">il ne fait qu'enregistrer</text>
    <text x="140" y="300" font-size="12" fill="#475569">une fonction pour plus tard</text>
    <text x="140" y="320" font-size="11" font-family="ui-monospace, monospace" fill="#d97706">addEventListener(…)</text>
    <text x="442" y="260" font-weight="600">2. Lecture du body</text>
    <text x="442" y="282" font-size="12" fill="#475569">la div #tableau est créée,</text>
    <text x="442" y="300" font-size="12" fill="#475569">le DOM est complet</text>
    <text x="752" y="260" font-weight="600">3. Événement DOMContentLoaded</text>
    <text x="752" y="282" font-size="12" fill="#16a34a">votre fonction est appelée :</text>
    <text x="752" y="300" font-size="12" fill="#16a34a">getElementById trouve la div,</text>
    <text x="752" y="320" font-size="12" fill="#16a34a">les 50 lignes s'affichent</text>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <line x1="260" y1="285" x2="303" y2="285"/>
    <line x1="580" y1="285" x2="623" y2="285"/>
  </g>
</svg>
