<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" width="900" height="400" viewBox="0 0 900 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrowr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="arrowb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <g stroke-width="2">
    <rect x="20" y="30" width="190" height="80" rx="10" fill="#f1f5f9" stroke="#475569"/>
    <rect x="250" y="30" width="190" height="80" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="480" y="30" width="400" height="80" rx="10" fill="#fef3c7" stroke="#d97706"/>
  </g>
  <g text-anchor="middle" fill="#0f172a">
    <text x="115" y="62" font-weight="600">1. Clic sur le bouton</text>
    <text x="115" y="84" font-size="12" fill="#475569">« Générer la punition »</text>
    <text x="345" y="62" font-weight="600">2. Événement submit</text>
    <text x="345" y="84" font-size="12" fill="#2563eb">levé sur le form #monForm</text>
    <text x="680" y="62" font-weight="600">3. L'écouteur appelle validateForm(evt)</text>
    <text x="680" y="84" font-size="12" font-family="ui-monospace, monospace" fill="#d97706">addEventListener("submit", validateForm)</text>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <line x1="210" y1="70" x2="248" y2="70"/>
    <line x1="440" y1="70" x2="478" y2="70"/>
    <line x1="680" y1="110" x2="680" y2="148"/>
  </g>
  <rect x="480" y="150" width="400" height="70" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="680" y="180" text-anchor="middle" font-weight="600" font-family="ui-monospace, monospace" font-size="12">evt.preventDefault()</text>
  <text x="680" y="202" text-anchor="middle" font-size="12" fill="#475569">le navigateur n'envoie rien au serveur, la page ne se recharge pas</text>
  <line x1="680" y1="220" x2="680" y2="248" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="580" y="250" width="200" height="40" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="680" y="275" text-anchor="middle" font-weight="600">La saisie est correcte ?</text>
  <path d="M580 270 H420 V318" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowr)"/>
  <text x="500" y="262" text-anchor="middle" font-size="12" fill="#dc2626">non</text>
  <path d="M750 290 V318" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowg)"/>
  <text x="760" y="310" font-size="12" fill="#16a34a">oui</text>
  <rect x="250" y="320" width="340" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="420" y="346" text-anchor="middle" font-weight="600" fill="#dc2626">alert("…") puis return</text>
  <text x="420" y="368" text-anchor="middle" font-size="12" fill="#dc2626">la fonction s'arrête, l'utilisateur corrige sa saisie</text>
  <rect x="620" y="320" width="260" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="750" y="346" text-anchor="middle" font-weight="600" fill="#16a34a">Votre code</text>
  <text x="750" y="368" text-anchor="middle" font-size="12" fill="#16a34a">remplir et afficher le tableau</text>
  <text x="20" y="160" font-size="12" fill="#475569">Tout se passe dans le navigateur :</text>
  <text x="20" y="180" font-size="12" fill="#475569">aucune requête ne part vers un serveur,</text>
  <text x="20" y="200" font-size="12" fill="#475569">c'est le JavaScript qui fait le travail.</text>
</svg>
