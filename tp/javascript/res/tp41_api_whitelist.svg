<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" width="900" height="330" viewBox="0 0 900 330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrowb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="arrowr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="900" height="330" fill="#ffffff"/>
  <g stroke-width="2">
    <rect x="20" y="110" width="200" height="80" rx="10" fill="#f1f5f9" stroke="#475569"/>
    <rect x="270" y="90" width="300" height="120" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="620" y="20" width="260" height="110" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="620" y="170" width="260" height="110" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  </g>
  <g text-anchor="middle" fill="#0f172a">
    <text x="120" y="142" font-weight="600">Navigateur</text>
    <text x="120" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">?page=videos</text>
    <text x="420" y="118" font-weight="600">api.php</text>
    <text x="420" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">header("content-type: …json")</text>
    <text x="420" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">in_array($_GET['page'],</text>
    <text x="420" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">$whitelist) ?</text>
    <text x="750" y="50" font-weight="600">oui</text>
    <text x="750" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">include("api/videos.php")</text>
    <text x="750" y="100" font-size="13">le JSON des vidéos</text>
    <text x="750" y="118" font-size="12" fill="#475569">200 OK</text>
    <text x="750" y="200" font-weight="600">non</text>
    <text x="750" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">HTTP/1.1 401 Unauthorized</text>
    <text x="750" y="250" font-size="13">une réponse vide</text>
    <text x="750" y="268" font-size="12" fill="#475569">response.json() échoue</text>
  </g>
  <line x1="220" y1="150" x2="268" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M570,125 H595 V75 H618" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrowg)"/>
  <path d="M570,175 H595 V225 H618" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrowr)"/>
  <text x="450" y="315" text-anchor="middle" fill="#475569" font-size="13">Une nouvelle API = un fichier dans api/ <tspan font-weight="600">et</tspan> son nom ajouté dans la $whitelist de api.php.</text>
</svg>
