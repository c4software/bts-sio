<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" width="900" height="340" viewBox="0 0 900 340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrowb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <rect width="900" height="340" fill="#ffffff"/>
  <!-- the host and the box -->
  <g stroke-width="2">
    <rect x="10" y="20" width="220" height="300" rx="12" fill="#f8fafc" stroke="#475569"/>
    <rect x="310" y="20" width="390" height="300" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-dasharray="6 4"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#0f172a">
    <text x="120" y="46">Votre machine (l'hôte)</text>
    <text x="505" y="46">dev-box (conteneur Docker)</text>
  </g>
  <!-- boxes -->
  <g stroke-width="2">
    <rect x="25" y="70" width="190" height="70" rx="10" fill="#ffffff" stroke="#475569"/>
    <rect x="25" y="210" width="190" height="80" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="325" y="70" width="360" height="70" rx="10" fill="#ffffff" stroke="#475569"/>
    <rect x="325" y="210" width="110" height="80" rx="10" fill="#fef3c7" stroke="#d97706"/>
    <rect x="450" y="210" width="110" height="80" rx="10" fill="#fef3c7" stroke="#d97706"/>
    <rect x="575" y="210" width="110" height="80" rx="10" fill="#fef3c7" stroke="#d97706"/>
    <rect x="790" y="150" width="96" height="170" rx="18" fill="#dcfce7" stroke="#16a34a"/>
  </g>
  <rect x="818" y="160" width="40" height="8" rx="4" fill="#16a34a"/>
  <!-- labels -->
  <g text-anchor="middle" fill="#0f172a">
    <text x="120" y="100" font-weight="600">Votre éditeur</text>
    <text x="120" y="122" font-size="12" fill="#475569">~/dev-box/data/projets/Hello</text>
    <text x="120" y="242" font-weight="600" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="14">./devbox-build.sh</text>
    <text x="120" y="264" font-size="12" fill="#475569">run, build, logs…</text>
    <text x="505" y="100" font-weight="600">Le même dossier</text>
    <text x="505" y="122" font-size="12" fill="#475569">~/projets/Hello : project.yml, Sources/</text>
    <text x="568" y="194" font-weight="600" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="14">devbox ios xcode</text>
    <text x="380" y="242" font-weight="600">XcodeGen</text>
    <text x="380" y="262" font-size="12" fill="#475569">project.yml</text>
    <text x="380" y="277" font-size="12" fill="#475569">en projet Xcode</text>
    <text x="505" y="242" font-weight="600">Build</text>
    <text x="505" y="262" font-size="12" fill="#475569">Swift et</text>
    <text x="505" y="277" font-size="12" fill="#475569">le SDK iOS</text>
    <text x="630" y="242" font-weight="600">Signature</text>
    <text x="630" y="262" font-size="12" fill="#475569">votre compte</text>
    <text x="630" y="277" font-size="12" fill="#475569">Apple (xtool)</text>
    <text x="838" y="235" font-weight="600">iPhone</text>
    <text x="838" y="257" font-size="12" fill="#475569">Hello.app</text>
    <text x="838" y="273" font-size="12" fill="#475569">installée</text>
    <text x="838" y="289" font-size="12" fill="#475569">et lancée</text>
  </g>
  <!-- the same folder, seen from both sides -->
  <line x1="215" y1="105" x2="325" y2="105" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="270" y="97" font-size="11" fill="#475569" text-anchor="middle">monté dans</text>
  <text x="270" y="122" font-size="11" fill="#475569" text-anchor="middle">la dev-box</text>
  <!-- flow -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="120" y1="140" x2="120" y2="208"/>
    <line x1="435" y1="250" x2="448" y2="250"/>
    <line x1="560" y1="250" x2="573" y2="250"/>
  </g>
  <g font-size="11" fill="#475569" text-anchor="start">
    <text x="128" y="170">vous le lancez</text>
    <text x="128" y="185">dans un terminal</text>
  </g>
  <g stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrowb)">
    <line x1="215" y1="250" x2="323" y2="250"/>
    <line x1="380" y1="208" x2="380" y2="142"/>
  </g>
  <g font-size="11" fill="#2563eb">
    <text x="268" y="242" text-anchor="middle">docker exec</text>
    <text x="268" y="268" text-anchor="middle">(en root)</text>
    <text x="388" y="170">lit le projet,</text>
    <text x="388" y="184">écrit build/</text>
  </g>
  <g stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrowg)">
    <line x1="685" y1="230" x2="788" y2="230"/>
    <line x1="685" y1="275" x2="788" y2="275"/>
  </g>
  <g font-size="12" fill="#16a34a" text-anchor="middle">
    <text x="745" y="222">USB</text>
    <text x="745" y="267">Wi-Fi</text>
    <text x="745" y="293">(iOS 27)</text>
  </g>
</svg>
