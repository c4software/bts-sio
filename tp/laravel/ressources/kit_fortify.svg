<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" width="820" height="330" viewBox="0 0 820 330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <defs>
