<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" width="900" height="470" viewBox="0 0 900 470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13"> 
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrowb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- lifelines headers -->
  <rect x="40" y="20" width="160" height="40" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="120" y="45" text-anchor="middle" font-weight="600">Navigateur</text>
  <rect x="370" y="20" width="160" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="45" text-anchor="middle" font-weight="600">Serveur (Laravel)</text>
  <rect x="700" y="20" width="160" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="780" y="45" text-anchor="middle" font-weight="600">Base de données</text>
  <g stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4">
    <line x1="120" y1="60" x2="120" y2="455"/>
    <line x1="450" y1="60" x2="450" y2="455"/>
    <line x1="780" y1="60" x2="780" y2="455"/>
  </g>
  <!-- phase labels -->
  <g font-size="12" font-weight="600" fill="#ffffff">
    <rect x="0" y="78" width="150" height="20" rx="4" fill="#475569"/><text x="8" y="92">1. Inscription</text>
    <rect x="0" y="168" width="150" height="20" rx="4" fill="#475569"/><text x="8" y="182">2. Connexion</text>
    <rect x="0" y="298" width="150" height="20" rx="4" fill="#475569"/><text x="8" y="312">3. Requêtes suivantes</text>
    <rect x="0" y="388" width="150" height="20" rx="4" fill="#475569"/><text x="8" y="402">4. Déconnexion</text>
  </g>
  <!-- 1 inscription -->
  <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)"><line x1="120" y1="110" x2="448" y2="110"/><line x1="450" y1="140" x2="778" y2="140"/></g>
  <text x="285" y="104" text-anchor="middle">POST /traitementRegister (email, mot de passe)</text>
  <text x="615" y="134" text-anchor="middle">INSERT email + <tspan font-weight="600">hash</tspan> (jamais le mot de passe)</text>
  <!-- 2 connexion -->
  <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <line x1="120" y1="200" x2="448" y2="200"/>
    <line x1="450" y1="225" x2="778" y2="225"/>
    <line x1="780" y1="250" x2="452" y2="250"/>
  </g>
  <text x="285" y="194" text-anchor="middle">POST /traitementLogin (email, mot de passe)</text>
  <text x="615" y="219" text-anchor="middle">SELECT … WHERE email = ?</text>
  <text x="615" y="244" text-anchor="middle">hash stocké</text>
  <rect x="462" y="258" width="240" height="20" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="582" y="272" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12">password_verify() ✓ → session</text>
  <line x1="450" y1="290" x2="122" y2="290" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowb)"/>
  <text x="285" y="284" text-anchor="middle" fill="#2563eb">Réponse + cookie <tspan font-family="ui-monospace, monospace">laravel_session=abc123</tspan></text>
  <!-- 3 requêtes suivantes -->
  <line x1="120" y1="330" x2="448" y2="330" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="285" y="324" text-anchor="middle">GET /todo + cookie <tspan font-family="ui-monospace, monospace">abc123</tspan></text>
  <rect x="462" y="338" width="330" height="20" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="627" y="352" text-anchor="middle" font-size="12">session abc123 → id utilisateur 1 → Auth::check() ✓</text>
  <line x1="450" y1="372" x2="122" y2="372" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowb)"/>
  <text x="285" y="366" text-anchor="middle" fill="#2563eb">La page TODO (l'utilisateur est reconnu)</text>
  <!-- 4 logout -->
  <line x1="120" y1="420" x2="448" y2="420" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="285" y="414" text-anchor="middle">GET /logout</text>
  <rect x="462" y="428" width="220" height="20" rx="4" fill="#fee2e2" stroke="#dc2626"/>
  <text x="572" y="442" text-anchor="middle" font-size="12">session vidée (Auth::logout())</text>
</svg>
