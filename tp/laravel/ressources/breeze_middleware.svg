<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" width="820" height="300" viewBox="0 0 820 300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="5" markerHeight="5" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="820" height="300" fill="#ffffff"/>
  <rect x="20" y="40" width="170" height="60" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="105" y="66" text-anchor="middle" font-weight="600">Navigateur</text>
  <text x="105" y="86" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12">GET /yolo-connected</text>
  <rect x="250" y="40" width="200" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="350" y="66" text-anchor="middle" font-weight="600">Middleware auth</text>
  <text x="350" y="86" text-anchor="middle" font-size="12">Utilisateur connecté ?</text>
  <rect x="520" y="40" width="280" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="66" text-anchor="middle" font-weight="600">Contrôleur</text>
  <text x="660" y="86" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12">YoloController@privateView</text>
  <rect x="250" y="190" width="200" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="350" y="216" text-anchor="middle" font-weight="600">Redirection</text>
  <text x="350" y="236" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12">302 vers /login</text>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="190" y1="70" x2="246" y2="70"/>
    <line x1="450" y1="70" x2="516" y2="70"/>
    <line x1="350" y1="100" x2="350" y2="186"/>
  </g>
  <text x="483" y="60" text-anchor="middle" font-weight="600" fill="#16a34a">oui</text>
  <text x="364" y="150" font-weight="600" fill="#dc2626">non</text>
  <text x="660" y="140" text-anchor="middle" font-size="12" fill="#475569">La page s'affiche</text>
  <text x="660" y="158" text-anchor="middle" font-size="12" fill="#475569">(Auth::user() est disponible)</text>
  <text x="470" y="216" font-size="12" fill="#475569">Le contrôleur n'est jamais exécuté,</text>
  <text x="470" y="234" font-size="12" fill="#475569">l'utilisateur arrive sur la page de connexion</text>
</svg>
