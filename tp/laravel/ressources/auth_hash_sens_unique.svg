<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" width="900" height="300" viewBox="0 0 900 300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14"> 
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrowr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="900" height="300" fill="#ffffff"/>
  <!-- Row 1 : hash -->
  <text x="20" y="40" font-weight="600" fill="#0f172a">À l'inscription : on hashe, puis on stocke le hash</text>
  <rect x="20" y="60" width="230" height="50" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="135" y="91" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13"> "monSuperMotDePasse"</text>
  <line x1="250" y1="85" x2="328" y2="85" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="330" y="60" width="180" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="420" y="91" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600">password_hash()</text>
  <line x1="510" y1="85" x2="588" y2="85" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="590" y="60" width="290" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="735" y="91" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12">$2y$12$k7aP…Xz9  (60 caractères)</text>
  <!-- Row 2 : impossible -->
  <rect x="590" y="140" width="290" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="735" y="171" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12">$2y$12$k7aP…Xz9</text>
  <line x1="590" y1="165" x2="512" y2="165" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowr)"/>
  <rect x="330" y="140" width="180" height="50" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="420" y="171" text-anchor="middle" font-size="16" font-weight="600" fill="#dc2626">???  ✗</text>
  <line x1="330" y1="165" x2="252" y2="165" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowr)"/>
  <rect x="20" y="140" width="230" height="50" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="135" y="171" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#94a3b8">"monSuperMotDePasse"</text>
  <text x="20" y="125" font-weight="600" fill="#dc2626">Retrouver le mot de passe à partir du hash : impossible (sens unique)</text>
  <!-- Row 3 : verify -->
  <text x="20" y="225" font-weight="600" fill="#0f172a">À la connexion : on ne déchiffre rien, on compare</text>
  <rect x="20" y="240" width="200" height="44" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="120" y="267" text-anchor="middle" font-size="12">mot de passe saisi</text>
  <rect x="240" y="240" width="200" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="340" y="267" text-anchor="middle" font-size="12">hash stocké en base</text>
  <line x1="220" y1="262" x2="238" y2="262" stroke="#475569" stroke-width="2"/>
  <line x1="440" y1="262" x2="488" y2="262" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="490" y="240" width="190" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="585" y="267" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600">password_verify()</text>
  <line x1="680" y1="262" x2="728" y2="262" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="730" y="240" width="150" height="44" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="805" y="267" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13"> true / false</text>
</svg>
