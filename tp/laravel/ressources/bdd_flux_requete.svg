<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" width="900" height="300" viewBox="0 0 900 300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15"> 
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <rect width="900" height="300" fill="#ffffff"/>
  <!-- boxes -->
  <g stroke-width="2">
    <rect x="20" y="70" width="140" height="70" rx="10" fill="#f1f5f9" stroke="#475569"/>
    <rect x="220" y="70" width="130" height="70" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="410" y="70" width="150" height="70" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="620" y="70" width="140" height="70" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="410" y="200" width="150" height="70" rx="10" fill="#fef3c7" stroke="#d97706"/>
  </g>
  <!-- database cylinder -->
  <g stroke="#475569" stroke-width="2" fill="#f1f5f9">
    <path d="M800,80 a40,12 0 0,1 80,0 v60 a40,12 0 0,1 -80,0 z"/>
    <ellipse cx="840" cy="80" rx="40" ry="12"/>
  </g>
  <!-- labels -->
  <g text-anchor="middle" fill="#0f172a">
    <text x="90" y="100" font-weight="600">Navigateur</text>
    <text x="90" y="122" font-size="12" fill="#475569">GET /todo</text>
    <text x="285" y="100" font-weight="600">Route</text>
    <text x="285" y="122" font-size="12" fill="#475569">routes/web.php</text>
    <text x="485" y="100" font-weight="600">Contrôleur</text>
    <text x="485" y="122" font-size="12" fill="#475569">TodoControleur</text>
    <text x="690" y="100" font-weight="600">Modèle</text>
    <text x="690" y="122" font-size="12" fill="#475569">Todo (Eloquent)</text>
    <text x="840" y="170" font-weight="600" font-size="13"> Base de données</text>
    <text x="840" y="188" font-size="12" fill="#475569">table todos</text>
    <text x="485" y="230" font-weight="600">Vue (Blade)</text>
    <text x="485" y="252" font-size="12" fill="#475569">todo.blade.php</text>
  </g>
  <!-- arrows forward -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="160" y1="95" x2="218" y2="95"/>
    <line x1="350" y1="95" x2="408" y2="95"/>
    <line x1="560" y1="95" x2="618" y2="95"/>
    <line x1="760" y1="95" x2="798" y2="95"/>
  </g>
  <g font-size="11" fill="#475569" text-anchor="middle">
    <text x="189" y="88">requête</text>
    <text x="379" y="88">appelle</text>
    <text x="589" y="88">Todo::all()</text>
    <text x="779" y="88">SQL</text>
    <text x="779" y="114">SELECT *</text>
  </g>
  <!-- return arrows -->
  <g stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrowg)">
    <path d="M690,140 V235 H562"/>
    <path d="M410,235 H90 V142"/>
  </g>
  <g font-size="12" fill="#16a34a" text-anchor="middle">
    <text x="640" y="185">objets $todos</text>
    <text x="250" y="228">HTML généré</text>
  </g>
</svg>
