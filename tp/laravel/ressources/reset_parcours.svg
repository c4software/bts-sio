<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" width="900" height="420" viewBox="0 0 900 420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13"> 
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="arrowr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="900" height="420" fill="#ffffff"/>
  <!-- 1 -->
  <rect x="20" y="30" width="250" height="70" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="145" y="56" text-anchor="middle" font-weight="600">1. GET /mot-de-passe-oublie</text>
  <text x="145" y="78" text-anchor="middle" fill="#475569">formulaire « votre email ? »</text>
  <line x1="270" y1="65" x2="318" y2="65" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 2 -->
  <rect x="320" y="20" width="260" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="46" text-anchor="middle" font-weight="600">2. POST /mot-de-passe-oublie</text>
  <text x="450" y="68" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12">reset_token = Str::random(64)</text>
  <text x="450" y="88" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12">expires_at = now + 30 min</text>
  <line x1="580" y1="65" x2="628" y2="65" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- email -->
  <rect x="630" y="20" width="250" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="755" y="46" text-anchor="middle" font-weight="600">✉ Email envoyé</text>
  <text x="755" y="68" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11">/reset-mot-de-passe/gT7fKq2Zp9…</text>
  <text x="755" y="90" text-anchor="middle" fill="#475569">(ici : storage/logs/laravel.log)</text>
  <!-- anti-enum note -->
  <rect x="320" y="120" width="260" height="42" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="450" y="138" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="600">Même réponse que l'email existe ou non</text>
  <text x="450" y="154" text-anchor="middle" font-size="11" fill="#475569">« Si cette adresse est associée à un compte… »</text>
  <!-- down -->
  <line x1="755" y1="110" x2="755" y2="188" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="767" y="152" fill="#475569" font-size="12">l'utilisateur clique</text>
  <!-- 3 -->
  <rect x="630" y="190" width="250" height="70" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="755" y="216" text-anchor="middle" font-weight="600">3. GET /reset-mot-de-passe/{token}</text>
  <text x="755" y="238" text-anchor="middle" fill="#475569">formulaire « nouveau mot de passe »</text>
  <line x1="630" y1="225" x2="582" y2="225" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- decision -->
  <polygon points="450,185 580,225 450,265 320,225" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="450" y="218" text-anchor="middle" font-weight="600">token connu ET</text>
  <text x="450" y="236" text-anchor="middle" font-weight="600">non expiré ?</text>
  <text x="450" y="254" text-anchor="middle" font-size="11" fill="#475569">(vérifié au GET et au POST)</text>
  <!-- no -->
  <line x1="450" y1="265" x2="450" y2="333" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowr)"/>
  <text x="460" y="303" fill="#dc2626" font-weight="600">non</text>
  <rect x="320" y="335" width="260" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="450" y="360" text-anchor="middle" font-weight="600" fill="#dc2626">« Ce lien est invalide ou a expiré »</text>
  <text x="450" y="381" text-anchor="middle" fill="#475569">retour à /mot-de-passe-oublie</text>
  <!-- yes -->
  <line x1="320" y1="225" x2="272" y2="225" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowg)"/>
  <text x="296" y="217" text-anchor="middle" fill="#16a34a" font-weight="600">oui</text>
  <rect x="20" y="175" width="250" height="220" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="145" y="203" text-anchor="middle" font-weight="600">4. POST /reset-mot-de-passe/{token}</text>
  <g fill="#0f172a">
    <text x="34" y="235">1. valider le formulaire</text>
    <text x="50" y="253" font-size="12" fill="#475569">min 8 caractères, confirmé</text>
    <text x="34" y="281" font-weight="600">2. password_hash()</text>
    <text x="50" y="299" font-size="12" fill="#475569">jamais le mot de passe en clair</text>
    <text x="34" y="327">3. token invalidé</text>
    <text x="50" y="345" font-size="12" fill="#475569">(colonnes à NULL : usage unique)</text>
    <text x="34" y="375">4. redirection /login 🎉</text>
  </g>
</svg>
