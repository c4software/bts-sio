<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" width="900" height="240" viewBox="0 0 900 240"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrowg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arrowr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrowb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
<rect width="900" height="240" fill="#ffffff"/>
<rect x="20" y="40" width="190" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="115" y="66" text-anchor="middle" font-weight="600">Page publique</text>
<text x="115" y="84" text-anchor="middle" font-size="12" fill="#475569">d'un article (public.show)</text>
<text x="115" y="104" text-anchor="middle" font-size="12">liste des commentaires</text>
<text x="115" y="120" text-anchor="middle" font-size="12">+ formulaire <tspan fill="#475569">(@auth)</tspan></text>
<line x1="210" y1="85" x2="268" y2="85" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="239" y="76" text-anchor="middle" font-size="11" fill="#475569">POST</text>
<rect x="270" y="40" width="200" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="370" y="66" text-anchor="middle" font-weight="600">comments.store</text>
<text x="370" y="86" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12">CommentController@store</text>
<text x="370" y="106" text-anchor="middle" font-size="12" fill="#475569">middleware auth</text>
<text x="370" y="122" text-anchor="middle" font-size="12" fill="#475569">validation du contenu</text>
<line x1="470" y1="85" x2="528" y2="85" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="530" y="40" width="190" height="90" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="625" y="66" text-anchor="middle" font-weight="600">Comment créé</text>
<g font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">
<text x="545" y="88">user_id    = Auth::id()</text>
<text x="545" y="104">article_id = l'article</text>
<text x="545" y="120">content    = le texte</text>
</g>
<path d="M720,85 H800 V170 H115 V132" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowb)"/>
<text x="460" y="164" text-anchor="middle" font-size="12" fill="#2563eb">redirect()->back() : retour sur l'article, le commentaire apparaît dans la liste</text>
<text x="450" y="215" text-anchor="middle" font-size="12" fill="#475569">Même mécanique pour les catégories (sync) et les likes (un compteur incrémenté) : une route POST, une méthode, un retour sur la page.</text>
</svg>
