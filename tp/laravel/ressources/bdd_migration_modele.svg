<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" width="900" height="330" viewBox="0 0 900 330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14"> 
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="900" height="330" fill="#ffffff"/>
  <!-- migration file -->
  <rect x="20" y="40" width="270" height="200" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="68" text-anchor="middle" font-weight="600" fill="#0f172a">La migration (PHP)</text>
  <text x="155" y="86" text-anchor="middle" font-size="11" fill="#475569">database/migrations/…_create_todos_table.php</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0f172a">
    <text x="36" y="118">Schema::create('todos', …</text>
    <text x="52" y="140">$table-&gt;id();</text>
    <text x="52" y="162">$table-&gt;string('texte');</text>
    <text x="52" y="184">$table-&gt;boolean('termine')</text>
    <text x="52" y="204">      -&gt;default(false);</text>
    <text x="52" y="226">$table-&gt;timestamps();</text>
  </g>
  <!-- arrow migrate -->
  <line x1="290" y1="150" x2="368" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="120" text-anchor="middle" font-size="11" fill="#475569" font-family="ui-monospace, monospace">php artisan</text><text x="330" y="133" text-anchor="middle" font-size="11" fill="#475569" font-family="ui-monospace, monospace">migrate</text>
  <!-- table -->
  <g stroke="#475569" stroke-width="1.5">
    <rect x="370" y="40" width="250" height="200" rx="8" fill="#ffffff"/>
    <rect x="370" y="40" width="250" height="34" rx="8" fill="#475569"/>
    <rect x="370" y="60" width="250" height="14" fill="#475569" stroke="none"/>
  </g>
  <text x="495" y="63" text-anchor="middle" font-weight="600" fill="#ffffff">table todos</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0f172a">
    <text x="385" y="98">id</text><text x="605" y="98" text-anchor="end" fill="#475569">INTEGER (clé)</text>
    <text x="385" y="124">texte</text><text x="605" y="124" text-anchor="end" fill="#475569">VARCHAR</text>
    <text x="385" y="150">termine</text><text x="605" y="150" text-anchor="end" fill="#475569">BOOLEAN</text>
    <text x="385" y="176">created_at</text><text x="605" y="176" text-anchor="end" fill="#475569">DATETIME</text>
    <text x="385" y="202">updated_at</text><text x="605" y="202" text-anchor="end" fill="#475569">DATETIME</text>
  </g>
  <g stroke="#e2e8f0"><line x1="370" y1="106" x2="620" y2="106"/><line x1="370" y1="132" x2="620" y2="132"/><line x1="370" y1="158" x2="620" y2="158"/><line x1="370" y1="184" x2="620" y2="184"/></g>
  <text x="495" y="262" text-anchor="middle" font-size="12" fill="#475569">Une ligne de la table…</text>
  <!-- arrow to model -->
  <line x1="620" y1="140" x2="668" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- model -->
  <rect x="670" y="40" width="210" height="200" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="775" y="68" text-anchor="middle" font-weight="600" fill="#0f172a">Le modèle Todo</text>
  <text x="775" y="86" text-anchor="middle" font-size="11" fill="#475569">app/Models/Todo.php</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0f172a">
    <text x="686" y="118">$todo = Todo::find(1);</text>
    <text x="686" y="146">$todo-&gt;id       // 1</text>
    <text x="686" y="168">$todo-&gt;texte    // "…"</text>
    <text x="686" y="190">$todo-&gt;termine  // false</text>
    <text x="686" y="220">$todo-&gt;save();</text>
  </g>
  <text x="775" y="262" text-anchor="middle" font-size="12" fill="#475569">… devient un objet PHP.</text>
  <!-- convention -->
  <rect x="20" y="284" width="860" height="32" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="450" y="305" text-anchor="middle" font-size="13" fill="#0f172a">Convention : modèle <tspan font-weight="600">Todo</tspan> (singulier) et table <tspan font-weight="600">todos</tspan> (pluriel). Laravel fait le lien tout seul.</text>
</svg>
