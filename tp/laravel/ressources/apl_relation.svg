<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" width="900" height="300" viewBox="0 0 900 300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13"> 
  <rect width="900" height="300" fill="#ffffff"/>
  <!-- utilisateurs -->
  <g stroke="#475569" stroke-width="1.5">
    <rect x="40" y="40" width="260" height="150" rx="8" fill="#ffffff"/>
    <rect x="40" y="40" width="260" height="34" rx="8" fill="#2563eb"/>
    <rect x="40" y="60" width="260" height="14" fill="#2563eb" stroke="none"/>
  </g>
  <text x="170" y="63" text-anchor="middle" font-weight="600" fill="#ffffff">utilisateurs</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0f172a">
    <text x="55" y="98" font-weight="600">id</text><text x="285" y="98" text-anchor="end" fill="#475569">clé primaire</text>
    <text x="55" y="124">name</text>
    <text x="55" y="150">email</text>
    <text x="55" y="176">password</text>
  </g>
  <g stroke="#e2e8f0"><line x1="40" y1="106" x2="300" y2="106"/><line x1="40" y1="132" x2="300" y2="132"/><line x1="40" y1="158" x2="300" y2="158"/></g>
  <!-- todos -->
  <g stroke="#475569" stroke-width="1.5">
    <rect x="600" y="40" width="260" height="150" rx="8" fill="#ffffff"/>
    <rect x="600" y="40" width="260" height="34" rx="8" fill="#16a34a"/>
    <rect x="600" y="60" width="260" height="14" fill="#16a34a" stroke="none"/>
  </g>
  <text x="730" y="63" text-anchor="middle" font-weight="600" fill="#ffffff">todos</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0f172a">
    <text x="615" y="98" font-weight="600">id</text><text x="845" y="98" text-anchor="end" fill="#475569">clé primaire</text>
    <text x="615" y="124">texte</text>
    <text x="615" y="150">termine</text>
    <text x="615" y="176" font-weight="600" fill="#dc2626">utilisateur_id</text><text x="845" y="176" text-anchor="end" fill="#dc2626">clé étrangère</text>
  </g>
  <g stroke="#e2e8f0"><line x1="600" y1="106" x2="860" y2="106"/><line x1="600" y1="132" x2="860" y2="132"/><line x1="600" y1="158" x2="860" y2="158"/></g>
  <!-- relation line : crow's foot -->
  <line x1="300" y1="94" x2="600" y2="172" stroke="#dc2626" stroke-width="2"/>
  <line x1="300" y1="86" x2="300" y2="102" stroke="#dc2626" stroke-width="2"/>
  <g stroke="#dc2626" stroke-width="2" fill="none">
    <line x1="600" y1="172" x2="582" y2="160"/>
    <line x1="600" y1="172" x2="582" y2="184"/>
    <line x1="600" y1="172" x2="578" y2="172"/>
  </g>
  <text x="330" y="82" fill="#dc2626" font-weight="600">1</text>
  <text x="560" y="150" fill="#dc2626" font-weight="600">n</text>
  <text x="450" y="172" text-anchor="middle" fill="#0f172a">un utilisateur possède plusieurs TODO</text>
  <text x="450" y="190" text-anchor="middle" fill="#475569" font-size="12">une TODO appartient à un seul utilisateur</text>
  <!-- code -->
  <rect x="40" y="215" width="380" height="65" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="55" y="238" font-weight="600">Modèle Utilisateur</text>
  <text x="55" y="262" font-family="ui-monospace, monospace" font-size="12">todos() → $this-&gt;hasMany(Todo::class)</text>
  <rect x="480" y="215" width="380" height="65" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="495" y="238" font-weight="600">Modèle Todo</text>
  <text x="495" y="262" font-family="ui-monospace, monospace" font-size="12">utilisateur() → $this-&gt;belongsTo(Utilisateur::class)</text>
</svg>
