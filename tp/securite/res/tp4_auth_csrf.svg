<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" role="img" aria-label="Parcours d&#x27;une attaque CSRF : l&#x27;admin connecté ouvre un email piégé, son navigateur envoie la requête de suppression avec le cookie de session">
<rect x="1" y="1" width="778" height="428" rx="10" fill="#ffffff" stroke="#e2e2e3"/>
<defs><marker id="frouge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c62828"/></marker><marker id="fbleu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3451b2"/></marker><marker id="fvert" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#18794e"/></marker></defs>
<rect x="30" y="30" width="200" height="60" rx="8" fill="#f6f6f7" stroke="#c62828" stroke-width="2"/>
<text x="130.0" y="56.0" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#1b1b1f">Attaquant</text>
<text x="130.0" y="74.0" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#67676c">envoie un email piégé</text>
<rect x="30" y="170" width="200" height="84" rx="8" fill="#f6f6f7" stroke="#3451b2" stroke-width="2"/>
<text x="130.0" y="199.0" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#1b1b1f">Navigateur de l&#x27;admin</text>
<text x="130.0" y="217.0" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#67676c">connecté à votre-site</text>
<text x="130.0" y="235.0" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#67676c">PHPSESSID=8f3c…</text>
<rect x="550" y="170" width="200" height="84" rx="8" fill="#f6f6f7" stroke="#3451b2" stroke-width="2"/>
<text x="650.0" y="208.0" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#1b1b1f">votre-site</text>
<text x="650.0" y="226.0" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#67676c">admin.php</text>
<rect x="550" y="330" width="200" height="60" rx="8" fill="#f6f6f7" stroke="#3451b2" stroke-width="2"/>
<text x="650.0" y="356.0" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#1b1b1f">Base de données</text>
<text x="650.0" y="374.0" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#67676c">table users</text>
<path d="M130 90 L130 166" fill="none" stroke="#c62828" stroke-width="2.2" marker-end="url(#frouge)"/>
<circle cx="130" cy="128" r="11" fill="#c62828"/><text x="130" y="132.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fff">1</text>
<text x="150" y="124" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#c62828">l&#x27;admin ouvre l&#x27;email, qui contient :</text>
<text x="150" y="142" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#c62828">&lt;img src=&quot;http://votre-site/admin.php?id=1&quot;&gt;</text>
<path d="M230 212 L546 212" fill="none" stroke="#c62828" stroke-width="2.2" marker-end="url(#frouge)"/>
<circle cx="258" cy="212" r="11" fill="#c62828"/><text x="258" y="216.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fff">2</text>
<text x="282" y="202" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#c62828">GET /admin.php?id=1</text>
<text x="282" y="232" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#c62828">Cookie: PHPSESSID=8f3c…</text>
<text x="282" y="249" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#c62828">joint automatiquement par le navigateur</text>
<path d="M650 254 L650 326" fill="none" stroke="#c62828" stroke-width="2.2" marker-end="url(#frouge)"/>
<circle cx="650" cy="290" r="11" fill="#c62828"/><text x="650" y="294.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fff">3</text>
<text x="626" y="280" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#67676c">session valide, donc :</text>
<text x="626" y="298" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#c62828">DELETE FROM users WHERE id = 1</text>
<rect x="30" y="300" width="300" height="108" rx="8" fill="#f6f6f7" stroke="#18794e" stroke-width="2"/>
<text x="46" y="324" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#1b1b1f">Les parades</text>
<text x="46" y="346" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#18794e">POST : une image ne déclenche qu&#x27;un GET</text>
<text x="46" y="366" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#18794e">jeton : le piège ne connaît pas sa valeur</text>
<text x="46" y="386" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#18794e">SameSite=Strict : cookie non joint</text>
</svg>
