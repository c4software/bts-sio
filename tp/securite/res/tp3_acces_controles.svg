<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 396" width="780" height="396" role="img" aria-label="Une requête passe d&#x27;abord le contrôle « est connecté ? », puis « a le droit sur cette ressource ? », avant que le contrôleur ne réponde">
