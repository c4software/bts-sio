<text x="510.0" y="216.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#1b1b1f" xml:space="preserve">403 Forbidden</text>
<text x="510.0" y="234.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#67676c" xml:space="preserve">rien n&#x27;est montré</text>
<text x="32" y="284" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#67676c" xml:space="preserve">Le contrôle 2 dépend de la ressource demandée :</text>
<text x="44" y="312" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1b1b1f" xml:space="preserve">Exercice 2 (IDOR)</text>
<text x="200" y="312" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#3451b2" xml:space="preserve">$facture-&gt;user_id === Auth::id()</text>
<text x="44" y="338" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1b1b1f" xml:space="preserve">Exercice 3 (routes)</text>
<text x="200" y="338" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#3451b2" xml:space="preserve">middleware admin : rôle === &#x27;admin&#x27;</text>
<text x="32" y="372" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c62828" xml:space="preserve">Si le contrôle 2 manque, tout utilisateur connecté passe : c&#x27;est la faille A01.</text>
<text x="32" y="34" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#67676c" xml:space="preserve">Ce que le serveur doit vérifier à chaque requête</text>
