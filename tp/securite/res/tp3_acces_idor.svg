<circle cx="43" cy="294" r="11" fill="#3451b2"/><text x="43" y="298.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fff" xml:space="preserve">3</text>
<text x="62" y="298" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#1b1b1f" xml:space="preserve">Elle existe : if ($facture) est vrai,</text>
<text x="62" y="318" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#67676c" xml:space="preserve">mais user_id vaut 4, pas 1</text>
<circle cx="415" cy="294" r="11" fill="#c62828"/><text x="415" y="298.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fff" xml:space="preserve">4</text>
<text x="434" y="298" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#1b1b1f" xml:space="preserve">Réponse 200 : Alice lit la facture</text>
<text x="434" y="318" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#67676c" xml:space="preserve">de David (adresse, montant)</text>
<text x="32" y="362" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c62828" xml:space="preserve">Le serveur vérifie que la facture existe, jamais qu&#x27;elle appartient à la personne connectée.</text>
