<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 384" width="780" height="384" role="img" aria-label="Alice, connectée, demande la facture 8985 au lieu de 8986 ; le contrôleur la trouve en base et la renvoie sans vérifier qu&#x27;elle appartient à David">
