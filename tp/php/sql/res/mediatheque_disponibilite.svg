<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" width="900" height="360" viewBox="0 0 900 360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
