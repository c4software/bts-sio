  </g>
  <text x="450" y="328" text-anchor="middle" fill="#0f172a">Un emprunt relie <tspan font-weight="600">un</tspan> livre et <tspan font-weight="600">un</tspan> adhérent ; un livre comme un adhérent peut avoir <tspan font-weight="600">plusieurs</tspan> emprunts.</text>
