  <text x="195" y="392" text-anchor="middle" fill="#2563eb" font-size="12">true : redirection vers admin</text>
  <line x1="290" y1="440" x2="82" y2="440" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowr)"/>
  <text x="195" y="432" text-anchor="middle" fill="#dc2626" font-size="12">false : « Identifiants incorrects. »</text>
