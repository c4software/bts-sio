    <line x1="290" y1="135" x2="458" y2="135"/>
    <line x1="460" y1="170" x2="628" y2="170"/>
    <line x1="630" y1="205" x2="798" y2="205"/>
    <line x1="800" y1="235" x2="632" y2="235"/>
    <line x1="630" y1="265" x2="462" y2="265"/>
    <line x1="460" y1="365" x2="292" y2="365"/>
  </g>
  <text x="180" y="92" text-anchor="middle">POST email, mot de passe</text>
  <text x="375" y="127" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Auth::attempt(...)</text>
  <text x="545" y="162" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">findByEmail($email)</text>
  <text x="712" y="197" text-anchor="middle" font-size="12">SELECT WHERE email = ?</text>
  <text x="715" y="227" text-anchor="middle" font-size="12">la ligne (ou rien)</text>
  <text x="545" y="257" text-anchor="middle" font-size="12">un objet User (ou null)</text>
  <rect x="468" y="280" width="372" height="24" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="654" y="297" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">password_verify($password, $user-&gt;passwordHash)</text>
  <rect x="468" y="314" width="372" height="24" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="654" y="331" text-anchor="middle" font-size="12">session_regenerate_id(true), puis user_id et user_name</text>
  <text x="375" y="357" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">true ou false</text>
