<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" width="900" height="380" viewBox="0 0 900 380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>
  <!-- navigateur -->
  <rect x="20" y="20" width="310" height="340" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="175" y="48" text-anchor="middle" font-weight="600" fill="#0f172a">Navigateur du visiteur</text>
  <text x="40" y="78" font-size="12" fill="#475569">Ses cookies ($_COOKIE) :</text>
  <rect x="40" y="88" width="270" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="175" y="112" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#0f172a">PHPSESSID = 8f3b2c</text>
  <text x="175" y="132" text-anchor="middle" font-size="12" fill="#475569">un identifiant, rien d'autre</text>
  <rect x="40" y="158" width="270" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="175" y="182" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#0f172a">theme = sombre</text>
  <text x="175" y="202" text-anchor="middle" font-size="12" fill="#475569">une préférence, pour 30 jours</text>
  <rect x="40" y="250" width="270" height="88" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="175" y="276" text-anchor="middle" font-weight="600" fill="#dc2626">Lisible et modifiable</text>
  <text x="175" y="298" text-anchor="middle" font-size="12" fill="#0f172a">par le visiteur (F12) : à vérifier</text>
  <text x="175" y="318" text-anchor="middle" font-size="12" fill="#0f172a">comme une saisie de $_GET</text>
  <!-- serveur -->
  <rect x="440" y="20" width="440" height="340" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="660" y="48" text-anchor="middle" font-weight="600" fill="#0f172a">Serveur PHP</text>
  <rect x="460" y="66" width="400" height="156" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="660" y="90" text-anchor="middle" font-weight="600" fill="#2563eb">$_SESSION du tiroir 8f3b2c</text>
  <g font-family="ui-monospace, monospace" font-size="12" fill="#0f172a" style="white-space:pre">
    <text x="478" y="118">'last_phrase' =&gt; "Je ne parle pas en classe"</text>
    <text x="478" y="140">'last_count'  =&gt; 20</text>
    <text x="478" y="162">'generated'   =&gt; 2</text>
    <text x="478" y="184">'message'     =&gt; "Punition enregistrée !"</text>
  </g>
  <text x="660" y="210" text-anchor="middle" font-size="12" fill="#475569">L'état du visiteur, de confiance : vous seul l'écrivez</text>
  <rect x="460" y="240" width="400" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="266" text-anchor="middle" font-weight="600" fill="#16a34a">Base bart, table phrases</text>
  <text x="660" y="288" text-anchor="middle" font-size="12" fill="#0f172a">Les données : toutes les punitions, pour tout le monde</text>
  <text x="660" y="309" text-anchor="middle" font-size="12" fill="#0f172a">Elles survivent à la fermeture du navigateur</text>
  <text x="660" y="327" text-anchor="middle" font-size="12" fill="#0f172a">et au redémarrage du serveur</text>
  <!-- lien -->
  <line x1="312" y1="116" x2="457" y2="116" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="385" y="104" text-anchor="middle" font-size="12" fill="#475569">retrouve</text>
  <text x="385" y="138" text-anchor="middle" font-size="12" fill="#475569">son tiroir</text>
</svg>
