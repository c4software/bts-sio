<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" width="900" height="400" viewBox="0 0 900 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>

  <!-- l'expression -->
  <text x="450" y="40" text-anchor="middle" font-family="ui-monospace, monospace" font-size="20" font-weight="600"><tspan fill="#0f172a">echo $students</tspan><tspan fill="#2563eb">[1]</tspan><tspan fill="#16a34a">['notes']</tspan><tspan fill="#d97706">['php']</tspan><tspan fill="#0f172a">;  // 19</tspan></text>
  <text x="450" y="64" text-anchor="middle" font-size="12" fill="#475569">un crochet par niveau, de gauche à droite</text>

  <!-- niveau 1 -->
  <rect x="20" y="90" width="250" height="290" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="145" y="114" text-anchor="middle" font-weight="600" fill="#0f172a">Niveau 1 : <tspan font-family="ui-monospace, monospace">$students</tspan></text>
  <text x="145" y="132" text-anchor="middle" font-size="12" fill="#475569">tableau numéroté, un élève par case</text>
  <g stroke="#475569" stroke-width="1.5" fill="#ffffff">
    <rect x="40" y="146" width="210" height="30" rx="6"/>
    <rect x="40" y="184" width="210" height="30" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <rect x="40" y="222" width="210" height="30" rx="6"/>
    <rect x="40" y="260" width="210" height="30" rx="6"/>
    <rect x="40" y="298" width="210" height="30" rx="6"/>
    <rect x="40" y="336" width="210" height="30" rx="6"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="12" fill="#0f172a">
    <text x="52" y="166">[0] =&gt; Bart…</text>
    <text x="52" y="204" font-weight="600" fill="#2563eb">[1] =&gt; Lisa…</text>
    <text x="52" y="242">[2] =&gt; Milhouse…</text>
    <text x="52" y="280">[3] =&gt; Nelson…</text>
    <text x="52" y="318">[4] =&gt; Ralph…</text>
    <text x="52" y="356">[5] =&gt; Martin…</text>
  </g>

  <!-- niveau 2 -->
  <rect x="320" y="90" width="270" height="214" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="455" y="114" text-anchor="middle" font-weight="600" fill="#0f172a">Niveau 2 : <tspan font-family="ui-monospace, monospace">$students[1]</tspan></text>
  <text x="455" y="132" text-anchor="middle" font-size="12" fill="#475569">tableau associatif, un élève</text>
  <g stroke="#475569" stroke-width="1.5" fill="#ffffff">
    <rect x="340" y="146" width="230" height="30" rx="6"/>
    <rect x="340" y="184" width="230" height="30" rx="6"/>
    <rect x="340" y="222" width="230" height="30" rx="6"/>
    <rect x="340" y="260" width="230" height="30" rx="6" stroke="#16a34a" stroke-width="3"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="12" fill="#0f172a">
    <text x="352" y="166">'prenom' =&gt; 'Lisa'</text>
    <text x="352" y="204">'nom' =&gt; 'Simpson'</text>
    <text x="352" y="242">'age' =&gt; 8</text>
    <text x="352" y="280" font-weight="600" fill="#16a34a">'notes' =&gt; […]</text>
  </g>

  <!-- niveau 3 -->
  <rect x="640" y="90" width="240" height="176" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="760" y="114" text-anchor="middle" font-weight="600" fill="#0f172a">Niveau 3 : les notes</text>
  <text x="760" y="132" text-anchor="middle" font-size="12" fill="#475569">tableau associatif, matière vers note</text>
  <g stroke="#475569" stroke-width="1.5" fill="#ffffff">
    <rect x="660" y="146" width="200" height="30" rx="6" stroke="#d97706" stroke-width="3"/>
    <rect x="660" y="184" width="200" height="30" rx="6"/>
    <rect x="660" y="222" width="200" height="30" rx="6"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="12" fill="#0f172a">
    <text x="672" y="166" font-weight="600" fill="#d97706">'php' =&gt; 19</text>
    <text x="672" y="204">'sql' =&gt; 18</text>
    <text x="672" y="242">'reseau' =&gt; 17</text>
  </g>

  <!-- liens -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M250,199 H285 V161 H318"/>
    <path d="M570,275 H605 V161 H638"/>
  </g>
</svg>
