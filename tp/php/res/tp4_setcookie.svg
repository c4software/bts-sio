<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" width="900" height="400" viewBox="0 0 900 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrowb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="arrowr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <rect x="70" y="20" width="160" height="40" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="150" y="45" text-anchor="middle" font-weight="600">Navigateur</text>
  <rect x="670" y="20" width="160" height="40" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="750" y="45" text-anchor="middle" font-weight="600">Serveur PHP</text>
  <g stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4">
    <line x1="150" y1="60" x2="150" y2="385"/>
    <line x1="750" y1="60" x2="750" y2="385"/>
  </g>
  <!-- 1 -->
  <line x1="150" y1="100" x2="748" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="94" text-anchor="middle">1. Clic sur « Thème sombre » : <tspan font-family="ui-monospace, monospace" font-size="12">GET index.php?page=theme&amp;value=sombre</tspan></text>
  <rect x="440" y="112" width="300" height="46" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="590" y="132" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12">setcookie("theme", "sombre", …)</text>
  <text x="590" y="150" text-anchor="middle" font-size="12" fill="#475569"><tspan font-family="ui-monospace, monospace">$_COOKIE['theme']</tspan> n'existe pas encore</text>
  <!-- 2 -->
  <line x1="750" y1="188" x2="152" y2="188" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowb)"/>
  <text x="450" y="182" text-anchor="middle" fill="#2563eb">2. Réponse 302 : <tspan font-family="ui-monospace, monospace" font-size="12">Set-Cookie: theme=sombre</tspan> et <tspan font-family="ui-monospace, monospace" font-size="12">Location: …page=home</tspan></text>
  <rect x="160" y="200" width="300" height="46" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="310" y="220" text-anchor="middle" font-size="12">Le navigateur range <tspan font-family="ui-monospace, monospace">theme=sombre</tspan></text>
  <text x="310" y="238" text-anchor="middle" font-size="12" fill="#475569">pour 30 jours</text>
  <!-- 3 -->
  <line x1="150" y1="282" x2="748" y2="282" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="276" text-anchor="middle">3. <tspan font-family="ui-monospace, monospace" font-size="12">GET index.php?page=home</tspan>, avec <tspan font-family="ui-monospace, monospace" font-size="12">Cookie: theme=sombre</tspan></text>
  <rect x="440" y="294" width="300" height="30" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="590" y="314" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12">$_COOKIE['theme'] vaut "sombre"</text>
  <!-- 4 -->
  <line x1="750" y1="360" x2="152" y2="360" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowb)"/>
  <text x="450" y="354" text-anchor="middle" fill="#2563eb">4. La page, avec <tspan font-family="ui-monospace, monospace" font-size="12">&lt;body class="theme-sombre"&gt;</tspan></text>
</svg>
