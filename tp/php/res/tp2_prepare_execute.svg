<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" width="900" height="420" viewBox="0 0 900 420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrowb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  </defs>
  <rect width="900" height="420" fill="#ffffff"/>

  <!-- acteurs -->
  <rect x="40" y="20" width="180" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="47" text-anchor="middle" font-weight="600" fill="#0f172a">bart.php</text>
  <rect x="680" y="20" width="180" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="770" y="47" text-anchor="middle" font-weight="600" fill="#0f172a">Serveur MySQL</text>
  <g stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4">
    <line x1="130" y1="64" x2="130" y2="260"/>
    <line x1="770" y1="64" x2="770" y2="260"/>
  </g>

  <!-- 1 prepare -->
  <line x1="130" y1="110" x2="768" y2="110" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="84" text-anchor="middle" font-weight="600" fill="#0f172a">1. prepare() : le modèle, avec des trous</text>
  <text x="450" y="102" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#475569">INSERT INTO phrases (phrase, nombre) VALUES (?, ?)</text>

  <!-- 2 execute -->
  <line x1="130" y1="170" x2="768" y2="170" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowb)"/>
  <text x="450" y="144" text-anchor="middle" font-weight="600" fill="#2563eb">2. execute() : les valeurs, à part</text>
  <text x="450" y="162" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#2563eb">['Je n'oublierai pas l'apostrophe', 100]</text>

  <!-- 3 assemblage -->
  <rect x="470" y="192" width="390" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="665" y="215" text-anchor="middle" font-weight="600" fill="#0f172a">3. Le serveur remplit les ? dans l'ordre</text>
  <text x="665" y="236" text-anchor="middle" font-size="12" fill="#475569">une valeur reste une donnée, jamais du code SQL</text>

  <!-- comparaison -->
  <rect x="20" y="280" width="420" height="124" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="230" y="306" text-anchor="middle" font-weight="600" fill="#0f172a">Requête préparée</text>
  <text x="230" y="334" text-anchor="middle" font-size="13" fill="#0f172a">La phrase est enregistrée telle quelle,</text>
  <text x="230" y="354" text-anchor="middle" font-size="13" fill="#0f172a">apostrophes comprises.</text>
  <text x="230" y="384" text-anchor="middle" font-size="12" fill="#16a34a">Toujours avec une saisie utilisateur</text>

  <rect x="460" y="280" width="420" height="124" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="670" y="306" text-anchor="middle" font-weight="600" fill="#0f172a">Concaténation (à ne jamais faire)</text>
  <text x="670" y="334" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#0f172a">VALUES ('Je n'oublierai pas…', 100)</text>
  <text x="670" y="354" text-anchor="middle" font-size="13" fill="#0f172a">L'apostrophe ferme la chaîne SQL trop tôt :</text>
  <text x="670" y="384" text-anchor="middle" font-size="12" fill="#dc2626">erreur de syntaxe au mieux, injection SQL au pire</text>
</svg>
