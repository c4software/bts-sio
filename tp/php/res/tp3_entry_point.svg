<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" width="900" height="530" viewBox="0 0 900 530" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="arrowr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arrows" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="900" height="530" fill="#ffffff"/>

  <!-- les URL demandees -->
  <text x="130" y="40" text-anchor="middle" font-weight="600" fill="#0f172a">Navigateur</text>
  <g fill="#f1f5f9" stroke="#475569" stroke-width="2">
    <rect x="20" y="60" width="220" height="40" rx="10"/>
    <rect x="20" y="120" width="220" height="40" rx="10"/>
    <rect x="20" y="180" width="220" height="40" rx="10"/>
    <rect x="20" y="240" width="220" height="40" rx="10"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="12" fill="#0f172a" text-anchor="middle">
    <text x="130" y="85">index.php?page=bart</text>
    <text x="130" y="145">index.php?page=about</text>
    <text x="130" y="205" font-size="11">index.php?page=nimportequoi</text>
    <text x="130" y="265">index.php</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M240,80 H260 V260 H240"/>
    <path d="M240,140 H260"/>
    <path d="M240,200 H260"/>
  </g>
  <line x1="260" y1="170" x2="298" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="130" y="306" text-anchor="middle" font-size="12" fill="#475569">toutes les demandes arrivent</text>
  <text x="130" y="324" text-anchor="middle" font-size="12" fill="#475569">sur le même fichier</text>

  <!-- le point d'entree -->
  <rect x="300" y="20" width="580" height="490" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="590" y="46" text-anchor="middle" font-weight="600" fill="#0f172a">index.php, le point d'entrée</text>

  <g fill="#ffffff" stroke="#475569" stroke-width="2">
    <rect x="390" y="62" width="400" height="38" rx="10"/>
    <rect x="390" y="116" width="400" height="38" rx="10"/>
    <rect x="390" y="170" width="400" height="38" rx="10"/>
    <rect x="390" y="224" width="400" height="38" rx="10"/>
    <rect x="390" y="454" width="400" height="38" rx="10"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="12" fill="#0f172a" text-anchor="middle">
    <text x="590" y="86">ob_start(); session_start();</text>
    <text x="590" y="140">include('utils/db.php');  // $pdo</text>
    <text x="590" y="194">include('common/functions.php');</text>
    <text x="590" y="248">include('common/header.php');</text>
    <text x="590" y="478">include('common/footer.php');</text>
  </g>

  <!-- la decision -->
  <rect x="390" y="290" width="400" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="590" y="313" text-anchor="middle" font-weight="600" fill="#0f172a">La page demandée est-elle dans $whitelist ?</text>
  <text x="590" y="333" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#475569">in_array($_GET['page'], $whitelist)</text>

  <rect x="320" y="378" width="260" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="399" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#0f172a">include('pages/bart.php');</text>
  <text x="450" y="418" text-anchor="middle" font-size="12" fill="#16a34a">oui : la page demandée (ici bart)</text>

  <rect x="600" y="378" width="260" height="50" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="730" y="399" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#0f172a">include('pages/home.php');</text>
  <text x="730" y="418" text-anchor="middle" font-size="12" fill="#dc2626">non ou absente : l'accueil</text>

  <!-- fleches internes -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrows)">
    <line x1="590" y1="100" x2="590" y2="114"/>
    <line x1="590" y1="154" x2="590" y2="168"/>
    <line x1="590" y1="208" x2="590" y2="222"/>
    <line x1="590" y1="262" x2="590" y2="288"/>
    <line x1="450" y1="428" x2="550" y2="452"/>
    <line x1="730" y1="428" x2="630" y2="452"/>
  </g>
  <path d="M520,346 L470,376" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrowg)"/>
  <path d="M660,346 L710,376" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrowr)"/>

  <!-- la reponse -->
  <path d="M390,473 H130 V430" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrowg)"/>
  <rect x="20" y="354" width="220" height="74" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="130" y="380" text-anchor="middle" font-weight="600" fill="#0f172a">Une page complète</text>
  <text x="130" y="402" text-anchor="middle" font-size="12" fill="#475569">header + la page choisie</text>
  <text x="130" y="418" text-anchor="middle" font-size="12" fill="#475569">+ footer</text>
  <text x="200" y="465" text-anchor="middle" font-size="12" fill="#16a34a">HTML renvoyé</text>
</svg>
