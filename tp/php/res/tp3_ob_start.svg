<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" width="900" height="380" viewBox="0 0 900 380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>

  <!-- ligne 1 : sans ob_start -->
  <text x="20" y="34" font-weight="600" font-size="15" fill="#0f172a">Sans ob_start()</text>
  <g stroke-width="2">
    <rect x="20" y="50" width="200" height="110" rx="10" fill="#f1f5f9" stroke="#475569"/>
    <rect x="250" y="50" width="300" height="110" rx="10" fill="#f1f5f9" stroke="#475569"/>
    <rect x="580" y="50" width="300" height="110" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  </g>
  <g text-anchor="middle" fill="#0f172a">
    <text x="120" y="80" font-weight="600">1. header.php</text>
    <text x="120" y="102" font-size="12" fill="#475569">affiche le début</text>
    <text x="120" y="120" font-size="12" fill="#475569">du HTML</text>
    <text x="400" y="80" font-weight="600">2. Envoyé tout de suite</text>
    <text x="400" y="102" font-size="12" fill="#475569">les en-têtes HTTP partent,</text>
    <text x="400" y="120" font-size="12" fill="#475569">suivis du début de la page</text>
    <text x="730" y="80" font-weight="600">3. header('location: …')</text>
    <text x="730" y="102" font-size="12" fill="#dc2626">trop tard, les en-têtes sont partis :</text>
    <text x="730" y="124" font-size="11" font-family="ui-monospace, monospace" fill="#dc2626">Cannot modify header information</text>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <line x1="220" y1="105" x2="248" y2="105"/>
    <line x1="550" y1="105" x2="578" y2="105"/>
  </g>

  <!-- ligne 2 : avec ob_start -->
  <text x="20" y="214" font-weight="600" font-size="15" fill="#0f172a">Avec ob_start() en première ligne</text>
  <g stroke-width="2">
    <rect x="20" y="230" width="200" height="110" rx="10" fill="#f1f5f9" stroke="#475569"/>
    <rect x="250" y="230" width="300" height="110" rx="10" fill="#fef3c7" stroke="#d97706"/>
    <rect x="580" y="230" width="300" height="110" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  </g>
  <g text-anchor="middle" fill="#0f172a">
    <text x="120" y="260" font-weight="600">1. header.php</text>
    <text x="120" y="282" font-size="12" fill="#475569">affiche le début</text>
    <text x="120" y="300" font-size="12" fill="#475569">du HTML</text>
    <text x="400" y="260" font-weight="600">2. Gardé dans le tampon</text>
    <text x="400" y="282" font-size="12" fill="#475569">rien n'est encore parti :</text>
    <text x="400" y="300" font-size="12" fill="#475569">header('location: …') reste possible</text>
    <text x="730" y="260" font-weight="600">3. Fin du script</text>
    <text x="730" y="282" font-size="12" fill="#16a34a">PHP envoie les en-têtes (redirection</text>
    <text x="730" y="300" font-size="12" fill="#16a34a">comprise), puis tout le HTML d'un coup</text>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <line x1="220" y1="285" x2="248" y2="285"/>
    <line x1="550" y1="285" x2="578" y2="285"/>
  </g>
</svg>
