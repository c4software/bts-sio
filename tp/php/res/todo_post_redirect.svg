<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" width="900" height="470" viewBox="0 0 900 470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrowb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>
  <!-- lifelines headers -->
  <rect x="40" y="20" width="160" height="40" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="120" y="45" text-anchor="middle" font-weight="600">Navigateur</text>
  <rect x="370" y="20" width="160" height="40" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="45" text-anchor="middle" font-weight="600">Serveur PHP</text>
  <rect x="700" y="20" width="160" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="780" y="45" text-anchor="middle" font-weight="600">Base de données</text>
  <g stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4">
    <line x1="120" y1="60" x2="120" y2="455"/>
    <line x1="450" y1="60" x2="450" y2="455"/>
    <line x1="780" y1="60" x2="780" y2="455"/>
  </g>
  <!-- phase labels -->
  <g font-size="12" font-weight="600" fill="#ffffff">
    <rect x="0" y="76" width="190" height="20" rx="4" fill="#475569"/><text x="8" y="90">1. Envoi du formulaire (POST)</text>
    <rect x="0" y="246" width="190" height="20" rx="4" fill="#475569"/><text x="8" y="260">2. Redirection (GET)</text>
    <rect x="0" y="376" width="190" height="20" rx="4" fill="#475569"/><text x="8" y="390">3. L'utilisateur appuie sur F5</text>
  </g>
  <!-- 1 POST -->
  <line x1="120" y1="118" x2="448" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="285" y="112" text-anchor="middle">POST index.php?page=ajouter</text>
  <line x1="450" y1="140" x2="778" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="615" y="134" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12">INSERT INTO taches … (?, ?)</text>
  <rect x="462" y="154" width="300" height="22" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="612" y="169" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12">$_SESSION['flash'] = "Tâche ajoutée."</text>
  <line x1="450" y1="210" x2="122" y2="210" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowb)"/>
  <text x="285" y="204" text-anchor="middle" fill="#2563eb">302, <tspan font-family="ui-monospace, monospace">location: index.php?page=home</tspan></text>
  <text x="285" y="228" text-anchor="middle" font-size="12" fill="#475569">aucun HTML : header() puis die()</text>
  <!-- 2 GET -->
  <line x1="120" y1="288" x2="448" y2="288" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="285" y="282" text-anchor="middle">GET index.php?page=home (automatique)</text>
  <line x1="450" y1="310" x2="778" y2="310" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="615" y="304" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12">SELECT … JOIN categories</text>
  <rect x="462" y="320" width="300" height="22" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="612" y="335" text-anchor="middle" font-size="12">header.php affiche le flash, puis unset()</text>
  <line x1="450" y1="360" x2="122" y2="360" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowb)"/>
  <text x="285" y="354" text-anchor="middle" fill="#2563eb">La liste + « Tâche ajoutée. »</text>
  <!-- 3 F5 -->
  <line x1="120" y1="418" x2="448" y2="418" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="285" y="412" text-anchor="middle">GET index.php?page=home</text>
  <line x1="450" y1="446" x2="122" y2="446" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowb)"/>
  <text x="285" y="440" text-anchor="middle" fill="#2563eb">La liste, sans message et sans doublon</text>
  <rect x="520" y="400" width="300" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="670" y="425" text-anchor="middle" fill="#0f172a">Pas de nouvel INSERT : la tâche reste unique</text>
</svg>
