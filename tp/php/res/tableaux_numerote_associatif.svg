<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" width="900" height="330" viewBox="0 0 900 330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#475569"/></marker>
  </defs>
  <rect width="900" height="330" fill="#ffffff"/>

  <!-- tableau numerote -->
  <rect x="20" y="20" width="420" height="290" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="230" y="48" text-anchor="middle" font-weight="600" fill="#0f172a"><tspan font-family="ui-monospace, monospace">$subjects</tspan> : tableau numéroté</text>
  <text x="230" y="68" text-anchor="middle" font-size="12" fill="#475569">des choses de même nature, des clés données par PHP</text>
  <g font-size="12" fill="#475569" text-anchor="middle"><text x="110" y="96">clé</text><text x="290" y="96">valeur</text></g>
  <g stroke-width="2">
    <g fill="#fef3c7" stroke="#d97706">
      <rect x="60" y="104" width="100" height="34" rx="8"/>
      <rect x="60" y="148" width="100" height="34" rx="8"/>
      <rect x="60" y="192" width="100" height="34" rx="8"/>
      <rect x="60" y="236" width="100" height="34" rx="8"/>
    </g>
    <g fill="#ffffff" stroke="#475569">
      <rect x="210" y="104" width="160" height="34" rx="8"/>
      <rect x="210" y="148" width="160" height="34" rx="8"/>
      <rect x="210" y="192" width="160" height="34" rx="8"/>
      <rect x="210" y="236" width="160" height="34" rx="8"/>
    </g>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <line x1="160" y1="121" x2="208" y2="121"/>
    <line x1="160" y1="165" x2="208" y2="165"/>
    <line x1="160" y1="209" x2="208" y2="209"/>
    <line x1="160" y1="253" x2="208" y2="253"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="13" fill="#0f172a" text-anchor="middle">
    <text x="110" y="126">0</text><text x="290" y="126">'PHP'</text>
    <text x="110" y="170">1</text><text x="290" y="170">'SQL'</text>
    <text x="110" y="214">2</text><text x="290" y="214">'Réseau'</text>
    <text x="110" y="258">3</text><text x="290" y="258">'Maths'</text>
  </g>
  <text x="230" y="294" text-anchor="middle" font-size="12" fill="#0f172a"><tspan font-family="ui-monospace, monospace">$subjects[0]</tspan> vaut 'PHP' : on commence à zéro</text>

  <!-- tableau associatif -->
  <rect x="460" y="20" width="420" height="290" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="670" y="48" text-anchor="middle" font-weight="600" fill="#0f172a"><tspan font-family="ui-monospace, monospace">$student</tspan> : tableau associatif</text>
  <text x="670" y="68" text-anchor="middle" font-size="12" fill="#475569">des informations différentes, des clés choisies par vous</text>
  <g font-size="12" fill="#475569" text-anchor="middle"><text x="550" y="96">clé</text><text x="730" y="96">valeur</text></g>
  <g stroke-width="2">
    <g fill="#fef3c7" stroke="#d97706">
      <rect x="500" y="104" width="100" height="34" rx="8"/>
      <rect x="500" y="148" width="100" height="34" rx="8"/>
      <rect x="500" y="192" width="100" height="34" rx="8"/>
    </g>
    <g fill="#ffffff" stroke="#475569">
      <rect x="650" y="104" width="160" height="34" rx="8"/>
      <rect x="650" y="148" width="160" height="34" rx="8"/>
      <rect x="650" y="192" width="160" height="34" rx="8"/>
    </g>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <line x1="600" y1="121" x2="648" y2="121"/>
    <line x1="600" y1="165" x2="648" y2="165"/>
    <line x1="600" y1="209" x2="648" y2="209"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="13" fill="#0f172a" text-anchor="middle">
    <text x="550" y="126">'prenom'</text><text x="730" y="126">'Bart'</text>
    <text x="550" y="170">'nom'</text><text x="730" y="170">'Simpson'</text>
    <text x="550" y="214">'age'</text><text x="730" y="214">10</text>
  </g>
  <text x="670" y="294" text-anchor="middle" font-size="12" fill="#0f172a"><tspan font-family="ui-monospace, monospace">$student['age']</tspan> vaut 10 : la clé dit ce que c'est</text>
</svg>
