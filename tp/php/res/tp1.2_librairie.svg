    <text x="790" y="150">La personne « Valentin »</text>
    <text x="790" y="166">est agé de 39 ans.</text>
    <text x="790" y="200">Hello Valentin</text>
    <text x="790" y="216" fill="#475569">(index.php?prenom=Valentin)</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="330" y1="100" x2="388" y2="100" stroke-dasharray="5 4"/>
