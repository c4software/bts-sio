  </g>
  <g font-size="11" text-anchor="middle">
    <text x="354" y="92" fill="#475569">charge</text>
    <text x="354" y="142" fill="#475569">appel</text>
    <text x="354" y="192" fill="#475569">appel</text>
    <text x="664" y="142" fill="#16a34a">retour</text>
    <text x="664" y="192" fill="#16a34a">retour</text>
  </g>
  <text x="450" y="280" text-anchor="middle" font-size="13" fill="#0f172a">L'include rend les fonctions de la librairie disponibles dans la page.</text>
  <text x="450" y="302" text-anchor="middle" font-size="13" fill="#dc2626">Sans lui : « Call to undefined function formatIdentity() ».</text>
