<text x="36" y="474" font-weight="600" fill="#0f172a">Numéro de série vide : le service lève une IllegalArgumentException,</text>
<text x="36" y="494" font-weight="600" fill="#0f172a">la route la traduit en 400 Bad Request. Le DAO n'est jamais appelé.</text>
