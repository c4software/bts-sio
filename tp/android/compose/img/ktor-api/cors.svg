<text x="105.0" y="128" text-anchor="middle" font-size="11" fill="#475569">page sur</text>
<text x="105.0" y="145" text-anchor="middle" font-size="11" fill="#475569">localhost:5500</text>
<rect x="710" y="80" width="170" height="96" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="795.0" y="106" text-anchor="middle" font-weight="600" fill="#475569">API Ktor</text>
<text x="795.0" y="128" text-anchor="middle" font-size="11" fill="#475569">localhost:8080</text>
