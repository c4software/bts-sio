<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" width="900" height="320" viewBox="0 0 900 320"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrowg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arrowr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrowb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
<rect width="900" height="320" fill="#ffffff"/>
<text x="20" y="34" font-weight="600" font-size="16" fill="#0f172a">Les états de l'écran</text><rect x="20" y="60" width="156" height="70" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="98" y="90" text-anchor="middle" font-weight="600" fill="#475569">Permissions</text>
<text x="98" y="110" text-anchor="middle" font-size="12" fill="#475569">demander l'accès</text><rect x="196" y="60" width="156" height="70" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="274" y="90" text-anchor="middle" font-weight="600" fill="#475569">Prêt</text>
<text x="274" y="110" text-anchor="middle" font-size="12" fill="#475569">liste vide</text><rect x="372" y="60" width="156" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="450" y="90" text-anchor="middle" font-weight="600" fill="#2563eb">Scan</text>
<text x="450" y="110" text-anchor="middle" font-size="12" fill="#475569">10 secondes</text><rect x="548" y="60" width="156" height="70" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="626" y="90" text-anchor="middle" font-weight="600" fill="#d97706">Connexion</text>
<text x="626" y="110" text-anchor="middle" font-size="12" fill="#475569">loader</text><rect x="724" y="60" width="156" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="802" y="90" text-anchor="middle" font-weight="600" fill="#16a34a">Connecté</text>
<text x="802" y="110" text-anchor="middle" font-size="12" fill="#475569">LED, compteur</text><line x1="176" y1="95" x2="194" y2="95" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="186" y="152" text-anchor="middle" font-size="11" fill="#475569">accordées</text><line x1="352" y1="95" x2="370" y2="95" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="362" y="152" text-anchor="middle" font-size="11" fill="#475569">clic Scanner</text><line x1="528" y1="95" x2="546" y2="95" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="538" y="152" text-anchor="middle" font-size="11" fill="#475569">clic appareil</text><line x1="704" y1="95" x2="722" y2="95" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="714" y="152" text-anchor="middle" font-size="11" fill="#475569">services trouvés</text><path d="M450 130 V170 Q450 180 440 180 H284 Q274 180 274 170 V132" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<text x="362" y="198" text-anchor="middle" font-size="11" fill="#475569">fin du scan : la liste reste affichée</text>
<path d="M802 130 V214 Q802 224 792 224 H284 Q274 224 274 214 V200" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowr)"/>
<text x="540" y="244" text-anchor="middle" font-size="11" fill="#dc2626">déconnexion (bouton, lampe arrêtée, hors de portée) : retour à « Prêt »</text>
<rect x="20" y="262" width="860" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="36" y="289" fill="#475569">Chaque état correspond à une valeur de StateFlow dans le ViewModel. La vue choisit quoi afficher avec un simple when.</text>
</svg>
