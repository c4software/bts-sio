<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" width="900" height="318" viewBox="0 0 900 318"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrowg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arrowr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrowb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
<rect width="900" height="318" fill="#ffffff"/>
<text x="20" y="34" font-weight="600" font-size="16" fill="#0f172a">Qui fait quoi dans l'application</text><rect x="20" y="60" width="165" height="160" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="102" y="86" text-anchor="middle" font-weight="600" fill="#2563eb">La vue</text><text x="102" y="108" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="600">ScanScreen</text><text x="102" y="125" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="600">ConnectedScreen</text><text x="102" y="158" text-anchor="middle" font-size="11" fill="#475569">affiche l'état</text><text x="102" y="175" text-anchor="middle" font-size="11" fill="#475569">transmet les clics</text><rect x="245" y="60" width="165" height="160" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="327" y="86" text-anchor="middle" font-weight="600" fill="#7c3aed">Le ViewModel</text><text x="327" y="108" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="600">BleViewModel</text><text x="327" y="158" text-anchor="middle" font-size="11" fill="#475569">StateFlow d'état</text><text x="327" y="175" text-anchor="middle" font-size="11" fill="#475569">scan(), connect()</text><text x="327" y="192" text-anchor="middle" font-size="11" fill="#475569">toggleLed()</text><rect x="470" y="60" width="165" height="160" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="552" y="86" text-anchor="middle" font-weight="600" fill="#16a34a">Librairie Nordic</text><text x="552" y="108" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="600">CentralManager</text><text x="552" y="125" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="600">Peripheral</text><text x="552" y="158" text-anchor="middle" font-size="11" fill="#475569">scan(), connect()</text><text x="552" y="175" text-anchor="middle" font-size="11" fill="#475569">write(), subscribe()</text><rect x="695" y="60" width="165" height="160" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="777" y="86" text-anchor="middle" font-weight="600" fill="#d97706">Le périphérique</text><text x="777" y="108" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="600">ESP32</text><text x="777" y="158" text-anchor="middle" font-size="11" fill="#475569">service GATT</text><text x="777" y="175" text-anchor="middle" font-size="11" fill="#475569">LED, compteur, nom</text><line x1="187" y1="122" x2="241" y2="122" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="215" y="112" text-anchor="middle" font-size="11" fill="#475569">clics</text>
<line x1="243" y1="158" x2="189" y2="158" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowg)"/>
<text x="215" y="178" text-anchor="middle" font-size="11" fill="#16a34a">état</text><line x1="412" y1="122" x2="466" y2="122" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="440" y="112" text-anchor="middle" font-size="11" fill="#475569">appels</text>
<line x1="468" y1="158" x2="414" y2="158" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowg)"/>
<text x="440" y="178" text-anchor="middle" font-size="11" fill="#16a34a">Flow</text><line x1="637" y1="122" x2="691" y2="122" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="665" y="112" text-anchor="middle" font-size="11" fill="#475569">écrit</text>
<line x1="693" y1="158" x2="639" y2="158" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowg)"/>
<text x="665" y="178" text-anchor="middle" font-size="11" fill="#16a34a">notifie</text><rect x="20" y="242" width="860" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="36" y="265" font-weight="600">La vue ne parle jamais au Bluetooth.</text>
<text x="36" y="285" fill="#475569">Elle affiche l'état du ViewModel et lui transmet les clics. Le ViewModel est le seul à utiliser la librairie.</text>
