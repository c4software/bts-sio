<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" width="900" height="460" viewBox="0 0 900 460"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrowg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arrowr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrowb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
<rect width="900" height="460" fill="#ffffff"/>
<text x="20" y="34" font-weight="600" font-size="16" fill="#0f172a">Un clic sur « Basculer la LED », de bout en bout</text><rect x="30" y="50" width="160" height="34" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="110" y="72" text-anchor="middle" font-weight="600" fill="#2563eb">Vue</text>
<line x1="110" y1="84" x2="110" y2="372" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/><rect x="250" y="50" width="160" height="34" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
<text x="330" y="72" text-anchor="middle" font-weight="600" fill="#7c3aed">ViewModel</text>
<line x1="330" y1="84" x2="330" y2="372" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/><rect x="480" y="50" width="160" height="34" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
<text x="560" y="72" text-anchor="middle" font-weight="600" fill="#16a34a">Librairie Nordic</text>
<line x1="560" y1="84" x2="560" y2="372" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/><rect x="710" y="50" width="160" height="34" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
<text x="790" y="72" text-anchor="middle" font-weight="600" fill="#d97706">ESP32</text>
<line x1="790" y1="84" x2="790" y2="372" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/><line x1="110" y1="110" x2="324" y2="110" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="220" y="102" text-anchor="middle" font-size="12"  fill="#0f172a">toggleLed()</text><line x1="330" y1="145" x2="554" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="445" y="137" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace" fill="#0f172a">write("1".toByteArray())</text><line x1="560" y1="180" x2="784" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="675" y="172" text-anchor="middle" font-size="12"  fill="#0f172a">écriture GATT</text><line x1="790" y1="225" x2="566" y2="225" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowg)"/>
<text x="675" y="217" text-anchor="middle" font-size="12"  fill="#0f172a">notification état "1"</text><line x1="790" y1="258" x2="566" y2="258" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowg)"/>
<text x="675" y="250" text-anchor="middle" font-size="12"  fill="#0f172a">notification compteur "13"</text><line x1="560" y1="293" x2="336" y2="293" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowg)"/>
<text x="445" y="285" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace" fill="#0f172a">subscribe() émet la valeur</text><line x1="330" y1="328" x2="116" y2="328" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowg)"/>
<text x="220" y="320" text-anchor="middle" font-size="12"  fill="#0f172a">StateFlow mis à jour</text><rect x="40" y="350" width="140" height="26" rx="13" fill="#eff6ff" stroke="#2563eb"/>
<text x="110" y="368" text-anchor="middle" font-size="11" fill="#2563eb">recomposition</text>
<rect x="20" y="392" width="860" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="36" y="415" font-weight="600">L'application ne décide pas que la LED est allumée : c'est l'ESP32 qui le dit.</text>
<text x="36" y="434" fill="#475569">Le bouton physique ou un appel HTTP passent par le même chemin de notification, et l'écran reste juste.</text>
</svg>
