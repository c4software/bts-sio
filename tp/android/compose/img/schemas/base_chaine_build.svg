<rect x="20" y="112" width="210" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="34" y="132" font-size="12" font-weight="600" fill="#0f172a" font-family="ui-monospace, monospace">res/</text>
<text x="34" y="149" font-size="11" fill="#475569">images, textes, couleurs</text>
