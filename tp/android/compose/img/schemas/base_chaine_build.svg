<text x="693" y="125" font-size="12" font-weight="600" text-anchor="middle" fill="#475569" font-family="ui-monospace, monospace">adb</text>
<rect x="724" y="86" width="156" height="98" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="802" y="116" font-size="13" font-weight="600" text-anchor="middle" fill="#16a34a">Émulateur</text>
<text x="802" y="136" font-size="13" font-weight="600" text-anchor="middle" fill="#16a34a">ou téléphone</text>
<text x="802" y="160" font-size="11" text-anchor="middle" fill="#475569">installe et lance</text>
<rect x="20" y="236" width="860" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="36" y="259" font-size="13" font-weight="600" fill="#0f172a">Le premier build est long : Gradle télécharge ses dépendances une seule fois.</text>
<text x="36" y="279" font-size="13" fill="#475569">Ensuite, seuls les fichiers modifiés sont recompilés. Le fichier .apk est ce que l'on publie, signé avec une vraie clé, sur le Play Store.</text>
