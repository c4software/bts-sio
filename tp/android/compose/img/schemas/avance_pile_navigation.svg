<rect width="900" height="364" fill="#ffffff"/>
<text x="20" y="34" font-weight="600" font-size="16" fill="#0f172a">La pile de navigation : navigate() empile, popBackStack() dépile</text>
<text x="110" y="64" font-size="12" font-weight="600" text-anchor="middle" fill="#475569">Au démarrage</text>
