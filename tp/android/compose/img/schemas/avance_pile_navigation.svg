<rect x="20" y="296" width="860" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="36" y="319" font-size="13" font-weight="600" fill="#0f172a">Seul l'écran du dessus est affiché. Le bouton retour du téléphone fait la même chose que popBackStack().</text>
<text x="36" y="339" font-size="13" fill="#475569">Le paramètre (Valentin) fait partie de la route : screen2/{name} le récupère dans backStackEntry.arguments.</text>
