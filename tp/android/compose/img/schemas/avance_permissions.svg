<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" width="900" height="432" viewBox="0 0 900 432"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrowg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arrowr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrowb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrowv" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrowa" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
<rect width="900" height="432" fill="#ffffff"/>
<text x="20" y="34" font-weight="600" font-size="16" fill="#0f172a">Demander une permission : le parcours complet</text>
<rect x="20" y="60" width="190" height="76" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="115" y="88" font-size="13" font-weight="600" text-anchor="middle" fill="#475569">1. Déclarer</text>
<text x="115" y="110" font-size="11" text-anchor="middle" fill="#0f172a" font-family="ui-monospace, monospace">AndroidManifest.xml</text>
<rect x="250" y="60" width="190" height="76" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="345" y="88" font-size="13" font-weight="600" text-anchor="middle" fill="#7c3aed">2. Vérifier</text>
<text x="345" y="110" font-size="11" text-anchor="middle" fill="#0f172a" font-family="ui-monospace, monospace">allPermissionsGranted ?</text>
<rect x="480" y="60" width="190" height="76" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="575" y="88" font-size="13" font-weight="600" text-anchor="middle" fill="#2563eb">3. Demander</text>
<text x="575" y="110" font-size="10" text-anchor="middle" fill="#0f172a" font-family="ui-monospace, monospace">launchMultiplePermission…</text>
<rect x="710" y="60" width="170" height="76" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="795" y="88" font-size="13" font-weight="600" text-anchor="middle" fill="#d97706">Dialogue système</text>
<text x="795" y="110" font-size="11" text-anchor="middle" fill="#475569">Autoriser / Refuser</text>
<line x1="210" y1="98" x2="248" y2="98" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="440" y1="98" x2="478" y2="98" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="459" y="88" font-size="11" font-weight="600" text-anchor="middle" fill="#dc2626">non</text>
<line x1="670" y1="98" x2="708" y2="98" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="250" y="190" width="190" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="345" y="216" font-size="13" font-weight="600" text-anchor="middle" fill="#16a34a">Utiliser la fonction</text>
<text x="345" y="236" font-size="11" text-anchor="middle" fill="#475569">scanner, localiser…</text>
<line x1="345" y1="136" x2="345" y2="188" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowg)"/>
<text x="355" y="166" font-size="11" font-weight="600" fill="#16a34a">oui</text>
<path d="M795 136 V220 H442" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowg)"/>
<text x="620" y="212" font-size="11" font-weight="600" text-anchor="middle" fill="#16a34a">accordée</text>
<rect x="480" y="280" width="400" height="64" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="496" y="306" font-size="13" font-weight="600" fill="#dc2626">Refusée</text>
<text x="496" y="328" font-size="11" fill="#0f172a">expliquer pourquoi (shouldShowRationale), puis redemander</text>
<path d="M860 136 V278" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowr)"/>
<text x="870" y="210" font-size="1" fill="#0f172a"></text>
<rect x="20" y="364" width="860" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="36" y="387" font-size="13" font-weight="600" fill="#0f172a">Déclarer dans le Manifest ne suffit pas : depuis Android 6, l'utilisateur doit accepter à l'exécution.</text>
<text x="36" y="407" font-size="13" fill="#475569">Le Bluetooth demande BLUETOOTH_SCAN et BLUETOOTH_CONNECT (Android 12+), ou la localisation sur les versions plus anciennes.</text>
</svg>
